<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <title>Nothing Left</title>
  <style>
    .ink { fill: #151618; }
    .brand { fill: #f3b621; }
    .sm { display: none; }
    /* At favicon sizes the bars are redrawn on a 16px grid so their edges land on whole pixels. */
    @media (max-width: 32px) {
      .lg { display: none; }
      .sm { display: inline; }
    }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6e8ea; }
      .brand { fill: #f9bc2c; }
    }
  </style>
  <g class="lg">
    <polygon class="ink" points="33,5 7,5 2,9 28,9"/>
    <polygon class="ink" points="33,14 13,14 8,18 28,18"/>
    <polygon class="ink" points="33,23 19,23 14,27 28,27"/>
    <polygon class="brand" points="33,32 25,32 20,36 28,36"/>
  </g>
  <g class="sm" transform="scale(2.5)">
    <polygon class="ink" points="3,1 15,1 13,3 1,3"/>
    <polygon class="ink" points="6,5 15,5 13,7 4,7"/>
    <polygon class="ink" points="9,9 15,9 13,11 7,11"/>
    <polygon class="brand" points="11,13 15,13 13,15 9,15"/>
  </g>
</svg>
