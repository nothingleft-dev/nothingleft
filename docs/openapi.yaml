  /v1/reports/burndown:
    get:
      summary: Burndown of a sprint
      description: |
        Remaining work across a sprint, read from `sprint_snapshots` (nightly at 00:05 UTC and at
        start and finish, UTC days) plus, for an active sprint, today's figures read live
        (reports.md § 5). `measure` is story points, issue count or remaining estimate (the
        project's Estimation field when it has chosen one). `scope` is the committed total each
        day and `scope_added` its net change since the first snapshot, so added work is its own
        series; `ideal` falls in a straight line across working days to 0 on the end date. Days
        before today with no snapshot are null. A sprint that has not started has no figures and
        answers with `empty.reason` `no_snapshots`. A sprint is whole-sprint: there is no query.

        Scoped like every report (reports.md § Implementation): the query and saved view pass
        through the search pipeline, scoped to the caller's readable projects before anything is
