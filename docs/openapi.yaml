  /v1/projects/{key}/custom-fields:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Custom fields of a project
      description: Every project member, archived fields included unless `archived` says otherwise. In `position` order; not paged.
      tags: [custom-fields]
      parameters:
        - { name: archived, in: query, schema: { type: string, enum: ['true', 'false'] }, description: 'true: archived only; false: live only.' }
      responses:
        '200':
          description: The project's custom fields.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/CustomField' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
    post:
      summary: Add a custom field
      description: |
        *Manage custom fields* — Project Admin and up, `admin:project` for a token; not on an archived
        project. Names are unique in the project, case-insensitively. The slug is the search attribute:
        the slugified name unless given, lower-case letters, digits and hyphens, never a built-in
        attribute, and fixed once created. One slug means one kind of value across the organisation
        (`409 custom_field.slug_conflict`). At most 50 live fields per project. `options` only for
        `select` and `multi_select`; `config` min / max for `number` and `integer`, `decimals` for
        `number`. A checkbox cannot be required. `default_value` takes a value's input form and is
        checked. Writes `custom_field_changed`.
      tags: [custom-fields]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomField' }
            example:
              name: Severity
              type: select
              applies_to: [Bug]
              options: [{ name: Low }, { name: High, color: red-3 }]
      responses:
        '201':
          description: The new field.
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldEnvelope' } } }
        '400':
          description: '`custom_field.slug_invalid`, `custom_field.slug_reserved`, `custom_field.config_invalid`, `custom_field.options_not_supported`, `custom_field.checkbox_not_required`, `issue.unknown_type` (an `applies_to` name, with `valid_values`), a `default_value` error (`field: default_value`), or validation.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
        '409':
          description: '`custom_field.name_taken`, `custom_field.slug_taken`, `custom_field.slug_conflict`, `custom_field.limit`, `custom_field.option_name_taken`, `custom_field.options_limit` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/custom-fields/{slug}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/CustomFieldSlug'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: One custom field
      tags: [custom-fields]
      responses:
        '200':
          description: The field.
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`custom_field.not_found`, with the slugs in `valid_values`; or `project.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    patch:
      summary: Change a custom field
      description: |
        *Manage custom fields*. Absent fields are unchanged; the type and slug never change.
        `applies_to: []` applies it to every type. Narrowing the types keeps the values of issues it
        stops applying to, hidden. Archiving keeps every value and the field stays searchable, but it
        cannot be written and issues no longer list it; a field that is the project's Estimation or
        Spent time cannot be archived (`409 custom_field.time_role`). Unarchiving counts toward the
        cap. Writes `custom_field_changed` with old and new values.
      tags: [custom-fields]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCustomField' }
      responses:
        '200':
          description: The field after the change.
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldEnvelope' } } }
        '400':
          description: As for create.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`custom_field.not_found` or `project.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: '`custom_field.name_taken`, `custom_field.time_role`, `custom_field.limit` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      summary: Delete a custom field
      description: |
        *Manage custom fields*. Destroys every value the field holds; history rows that name it stay.
        A project using it as its Estimation or Spent time returns to the built-in. Writes
        `custom_field_changed` with the number of issues that held a value.
      tags: [custom-fields]
      responses:
        '200':
          description: The deleted field, in its final state.
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`custom_field.not_found` or `project.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: '`project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/custom-fields/{slug}/options:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/CustomFieldSlug'
      - $ref: '#/components/parameters/XOrganization'
    post:
      summary: Add an option to a select field
      description: '*Manage custom fields*. Names are unique per field, case-insensitively; at most 200. `position` inserts and renumbers; omitted, it goes last. Writes `custom_field_changed`.'
      tags: [custom-fields]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomFieldOption' }
      responses:
        '201':
          description: The field with its options.
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldEnvelope' } } }
        '400':
          description: '`custom_field.options_not_supported` or validation.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`custom_field.not_found` or `project.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: '`custom_field.option_name_taken`, `custom_field.options_limit` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/custom-fields/{slug}/options/{name}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/CustomFieldSlug'
      - $ref: '#/components/parameters/ConfigValueName'
      - $ref: '#/components/parameters/XOrganization'
    patch:
      summary: Change an option
      description: '*Manage custom fields*. Options are referenced by id, so a rename changes every issue at once and writes no issue history. An archived option stays on the issues that have it but cannot be newly chosen. Writes `custom_field_changed`.'
      tags: [custom-fields]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCustomFieldOption' }
      responses:
        '200':
          description: The field with its options.
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldEnvelope' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`custom_field.option_not_found` (with the options in `valid_values`), `custom_field.not_found` or `project.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: '`custom_field.option_name_taken` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      summary: Delete an option
      description: |
        *Manage custom fields*. An option set on any issue needs `move_to`: every issue is re-pointed in
        the same transaction, with one never-coalesced `custom:<slug>` history row each. Without it the
        answer is `409 custom_field.option_in_use` with the count and the candidates in `valid_values`.
      tags: [custom-fields]
      parameters:
        - { name: move_to, in: query, schema: { type: string, maxLength: 100 }, description: The option to move its issues to. }
      responses:
        '200':
          description: The field with its remaining options.
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldEnvelope' } } }
        '400':
          description: '`custom_field.option_move_invalid`, with the candidates in `valid_values`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`custom_field.option_not_found`, `custom_field.not_found` or `project.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: '`custom_field.option_in_use` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/work-item-attributes:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Work item attributes of a project
      description: 'Every project member. The project''s own select attributes on logged time, beside the built-in Work type (`/work-types`), which is not listed here. In `position` order; not paged.'
      tags: [project-schema]
      responses:
        '200':
          description: The attributes with their values.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/WorkItemAttribute' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
    post:
      summary: Add a work item attribute
      description: |
        *Manage statuses, priorities, types, work types* — Project Admin and up, `admin:project`; not on an
        archived project. Names are unique in the project, and `Work type` is taken. At most 10 per
        project, 50 values each; a value's `short_label` defaults to its first letter. Writes
        `schema_changed` with `table: work_item_attributes`.
      tags: [project-schema]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkItemAttribute' }
            example: { name: Billable, values: [{ name: 'Yes' }, { name: 'No' }] }
      responses:
        '201':
          description: The new attribute.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemAttributeEnvelope' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
        '409':
          description: '`work_item_attribute.name_taken`, `work_item_attribute.limit`, `work_item_attribute.value_name_taken`, `work_item_attribute.values_limit` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/work-item-attributes/{name}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ConfigValueName'
      - $ref: '#/components/parameters/XOrganization'
    patch:
      summary: Change a work item attribute
      description: 'Rename, reorder, archive. An archived attribute stays on its entries but cannot be newly set. Writes `schema_changed`.'
      tags: [project-schema]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkItemAttribute' }
      responses:
        '200':
          description: The attribute after the change.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemAttributeEnvelope' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`work_item_attribute.not_found`, with the names in `valid_values`; or `project.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: '`work_item_attribute.name_taken` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      summary: Delete a work item attribute
      description: 'Removes it from every work item that had it; `time_logged` history keeps what was logged. Writes `schema_changed` with the count.'
      tags: [project-schema]
      responses:
        '200':
          description: The deleted attribute, in its final state.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemAttributeEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`work_item_attribute.not_found` or `project.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: '`project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/work-item-attributes/{name}/values:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ConfigValueName'
      - $ref: '#/components/parameters/XOrganization'
    post:
      summary: Add a value to a work item attribute
      tags: [project-schema]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkItemAttributeValue' }
      responses:
        '201':
          description: The attribute with its values.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemAttributeEnvelope' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`work_item_attribute.not_found` or `project.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: '`work_item_attribute.value_name_taken`, `work_item_attribute.values_limit` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/work-item-attributes/{name}/values/{value}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ConfigValueName'
      - { name: value, in: path, required: true, schema: { type: string, maxLength: 100 }, description: "The value's name, case-insensitive and URL-encoded." }
      - $ref: '#/components/parameters/XOrganization'
    patch:
      summary: Change a work item attribute value
      description: 'Rename (every entry follows), change the letter badge, reorder, archive.'
      tags: [project-schema]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkItemAttributeValue' }
      responses:
        '200':
          description: The attribute with its values.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemAttributeEnvelope' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`work_item_attribute.value_not_found`, `work_item_attribute.not_found` or `project.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: '`work_item_attribute.value_name_taken` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      summary: Delete a work item attribute value
      description: 'A value set on any work item needs `move_to`; without it `409 work_item_attribute.value_in_use` with the count and the candidates.'
      tags: [project-schema]
      parameters:
        - { name: move_to, in: query, schema: { type: string, maxLength: 100 }, description: The value to move its entries to. }
      responses:
        '200':
          description: The attribute with its remaining values.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemAttributeEnvelope' } } }
        '400':
          description: '`work_item_attribute.value_move_invalid`, with the candidates in `valid_values`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`work_item_attribute.value_not_found`, `work_item_attribute.not_found` or `project.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: '`work_item_attribute.value_in_use` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/sprints:
    parameters:
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Sprints across the organisation
      description: |
        Sprints in every project the caller can read in the current organisation — the dashboard's
        *Active sprints* rail and project cards (`?state=active`). Each carries its progress, with
        `mine` for the caller's own issues.
      tags: [agile]
      parameters:
        - $ref: '#/components/parameters/SprintStates'
      responses:
        '200':
          description: The sprints, by start date (unscheduled last).
          content: { application/json: { schema: { $ref: '#/components/schemas/SprintListEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/projects/{key}/sprints:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Sprints of a project
      description: Every project member. By start date, unscheduled last; not paged.
      tags: [agile]
      parameters:
        - $ref: '#/components/parameters/SprintStates'
      responses:
        '200':
          description: The project's sprints.
          content: { application/json: { schema: { $ref: '#/components/schemas/SprintListEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
    post:
      summary: Plan a sprint
      description: |
        Manage sprints and boards (Project Admin and up; a token needs `admin:project`). Names are
        unique in the project, case-insensitively; the slug is derived from the name and suffixed on
        collision. Dates are optional: without them the sprint is *Unscheduled*.
        `add_unresolved_from` moves another sprint's unresolved issues into the new one, each with
        `sprint_changed`.
      tags: [agile]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100, example: September 2026 }
                goal_md: { type: [string, 'null'], description: 'Markdown, 16KB at most (`sprint.goal_too_large`).' }
                start_date: { type: [string, 'null'], format: date }
                end_date: { type: [string, 'null'], format: date }
                add_unresolved_from: { type: string, description: "Another sprint's name or slug." }
      responses:
        '201':
          description: The new sprint.
          content: { application/json: { schema: { $ref: '#/components/schemas/SprintEnvelope' } } }
        '400':
          description: '`sprint.dates_out_of_order`, `sprint.goal_too_large` or a validation failure.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`project.not_found`, or `sprint.not_found` for `add_unresolved_from`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: '`sprint.name_taken` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/sprints/{sprint}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/SprintName'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: One sprint, with its snapshots
      description: Every project member. `snapshots` is the burndown's daily series.
      tags: [agile]
      responses:
        '200':
          description: The sprint.
          content: { application/json: { schema: { $ref: '#/components/schemas/SprintEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SprintNotFound' }
    patch:
      summary: Rename, re-date or change a sprint's goal
      description: |
        Manage sprints and boards. Absent fields are unchanged; `null` clears. A rename changes the
        slug. An active sprint keeps both dates. A completed sprint's name and goal stay editable.
      tags: [agile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                goal_md: { type: [string, 'null'] }
                start_date: { type: [string, 'null'], format: date }
                end_date: { type: [string, 'null'], format: date }
      responses:
        '200':
          description: The sprint after the change.
          content: { application/json: { schema: { $ref: '#/components/schemas/SprintEnvelope' } } }
        '400':
          description: '`sprint.dates_out_of_order`, `sprint.goal_too_large`, `sprint.end_date_required`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SprintNotFound' }
        '409':
          description: '`sprint.name_taken` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      summary: Delete a planned sprint
      description: |
        Manage sprints and boards. Only a planned sprint; its issues go back to the backlog first,
        each with `sprint_changed`. Answers the sprint as it was.
      tags: [agile]
      responses:
        '200':
          description: The deleted sprint, in its final state.
          content: { application/json: { schema: { $ref: '#/components/schemas/SprintEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SprintNotFound' }
        '409':
          description: '`sprint.delete_not_planned` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/sprints/{sprint}/start:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/SprintName'
      - $ref: '#/components/parameters/XOrganization'
    post:
      summary: Start a sprint
      description: |
        Manage sprints and boards. Planned → active; one active sprint per project. The start date
        is the caller's today unless `start_date` names another; the end
        date is the body's, else the planned one, and is required. Writes the first snapshot.
      tags: [agile]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
      responses:
        '200':
          description: The started sprint.
          content: { application/json: { schema: { $ref: '#/components/schemas/SprintEnvelope' } } }
        '400':
          description: '`sprint.end_date_required` or `sprint.dates_out_of_order`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SprintNotFound' }
        '409':
          description: '`sprint.not_planned`, `sprint.active_exists` (naming the active one), `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/sprints/{sprint}/finish:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/SprintName'
      - $ref: '#/components/parameters/XOrganization'
    post:
      summary: Finish a sprint
      description: |
        Manage sprints and boards. Active → completed. Every unresolved issue moves to
        `move_unfinished_to` — `backlog` or a planned sprint, required, no default — landing at the
        bottom in its current order, each with `sprint_changed` in one change group. The last
        snapshot is taken before they leave.
      tags: [agile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [move_unfinished_to]
              properties:
                move_unfinished_to: { type: string, example: backlog, description: '`backlog`, or the name or slug of a planned sprint.' }
      responses:
        '200':
          description: The completed sprint and what moved.
          content: { application/json: { schema: { $ref: '#/components/schemas/SprintFinishResultEnvelope' } } }
        '400':
          description: '`sprint.invalid_target` or `sprint.not_found` for the target, with `backlog` and the planned sprints in `valid_values`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SprintNotFound' }
        '409':
          description: '`sprint.not_active` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/backlog:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: One container of the backlog, in drag order
      description: |
        The backlog (issues in no sprint), or one sprint with `sprint`, filtered by `q` and in rank
        order: ranked issues first, the never-dragged after them by age. Pass `#Unresolved` for the
        backlog as the page shows it.
      tags: [agile]
      parameters:
        - { name: sprint, in: query, schema: { type: string, maxLength: 100 }, description: "A sprint's name or slug. Absent: the backlog." }
        - { name: q, in: query, schema: { type: string, maxLength: 2000 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: One page of the container.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        '400':
          description: A `query.*` error.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SprintNotFound' }

  /v1/projects/{key}/backlog/move:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/XOrganization'
    post:
      summary: Drag issues in the backlog
      description: |
        Update issue fields (Contributor and up; a token needs `issues:write`). Places `issues`, in
        the order given, `before` or `after` an issue, or at the bottom. `sprint` names the target
        container (`null` or `backlog`: the backlog); absent, the issues go where the anchor is, or
        stay where the first of them is. A sprint change writes `sprint_changed`; a reorder writes no
        history. The midpoint of the neighbours is written; a gap under `1e-6` renumbers the
        container in the same transaction.
      tags: [agile]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issues]
              properties:
                issues: { type: array, minItems: 1, maxItems: 100, items: { type: string, example: PMS-118 } }
                sprint: { type: [string, 'null'] }
                before: { type: string, example: PMS-12 }
                after: { type: string }
      responses:
        '200':
          description: The moved issues, in the order given.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        '400':
          description: '`backlog.issue_other_project`, `backlog.duplicate_issue`, `backlog.anchor_moving`, `backlog.anchor_not_in_container`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SprintNotFound' }
        '409':
          description: '`sprint.completed` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/boards/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string, maxLength: 100 }, description: 'A board slug, unique in the organisation.' }
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: A board by its slug alone
      description: The short `/board/<slug>` web route. The organisation is the session's or the token's; the board names its project.
      tags: [agile]
      responses:
        '200':
          description: The board.
          content: { application/json: { schema: { $ref: '#/components/schemas/BoardEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`board.slug_not_found`, also for a board in a project the caller cannot read.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/boards:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Boards of a project
      description: Every project member. Oldest first; the first is the project's own, created with it.
      tags: [agile]
      responses:
        '200':
          description: The boards.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Board' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
    post:
      summary: Create a board
      description: |
        Manage sprints and boards. Columns map values of `column_field` — status (default),
        priority or type; a value sits in at most one column. Without `columns`: a status board
        gets To do (backlog and unstarted) · In progress (started) · Done (done and cancelled), a
        priority or type board one column per value. Swimlanes: `none`; `values` of
        `swimlane_field` (never the column field: `board.swimlane_same_as_columns`); or `issues` —
        the issues of `swimlane_types` become lanes (default the project's Epic type). Moving a
        card is a PATCH of the issue's `column_field`.
      tags: [agile]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BoardInput' } } }
      responses:
        '201':
          description: The new board.
          content: { application/json: { schema: { $ref: '#/components/schemas/BoardEnvelope' } } }
        '400':
          description: '`board.unknown_value`, `board.value_twice`, `board.column_name_taken`, `board.wip_out_of_order`, `board.swimlane_field_required`, `board.swimlane_same_as_columns`, `board.unknown_type`, `board.swimlane_types_required`, with `valid_values` where there are some.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
        '409':
          description: '`board.name_taken` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/boards/{board}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/BoardName'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: A board's settings
      description: Columns with their statuses, WIP limits and the *resolved* flag; the statuses on no column; swimlanes.
      tags: [agile]
      responses:
        '200':
          description: The board.
          content: { application/json: { schema: { $ref: '#/components/schemas/BoardEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/BoardNotFound' }
    patch:
      summary: Change a board
      description: Manage sprints and boards. `columns`, when given, replaces the whole list in order. A new `column_field` without `columns` makes one column per value of it, in the project's order. A rename changes the slug.
      tags: [agile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                column_field: { $ref: '#/components/schemas/BoardColumnField' }
                columns: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/BoardColumnInput' } }
                swimlane_by: { $ref: '#/components/schemas/BoardSwimlane' }
                swimlane_field: { type: [string, 'null'], enum: [assignee, priority, type, null] }
                swimlane_types: { type: array, maxItems: 20, items: { type: string } }
      responses:
        '200':
          description: The board after the change.
          content: { application/json: { schema: { $ref: '#/components/schemas/BoardEnvelope' } } }
        '400':
          description: As for create.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BoardNotFound' }
        '409':
          description: '`board.name_taken` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      summary: Delete a board
      description: Manage sprints and boards. Issues and sprints are untouched.
      tags: [agile]
      responses:
        '200':
          description: The deleted board, in its final state.
          content: { application/json: { schema: { $ref: '#/components/schemas/BoardEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BoardNotFound' }
        '409':
          description: '`project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/boards/{board}/view:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/BoardName'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: The board on a sprint
      description: |
        Every project member. `sprint=current` (the default) is the active sprint; with none active
        `sprint` is `null` and there are no cards. `q` filters the cards: column `count` and the
        distribution strip follow it, column `total` (what WIP limits compare with) does not. Cards
        are in drag order, at most 500 (`truncated`). `swimlane_by` / `swimlane_field` override the
        board's own for this read.
      tags: [agile]
      parameters:
        - { name: sprint, in: query, schema: { type: string, maxLength: 100, default: current } }
        - { name: q, in: query, schema: { type: string, maxLength: 2000 } }
        - { name: swimlane_by, in: query, schema: { $ref: '#/components/schemas/BoardSwimlane' } }
        - { name: swimlane_field, in: query, schema: { type: string, enum: [assignee, priority, type] } }
      responses:
        '200':
          description: Columns, lanes and cards.
          content: { application/json: { schema: { $ref: '#/components/schemas/BoardViewEnvelope' } } }
        '400':
          description: A `query.*` error.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`board.not_found` or `sprint.not_found`, with the names in `valid_values`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/issues:
    get:
      summary: Search issues
      description: |
        The issue list and search: one query language (docs/search-query-language.md), every
        readable project of the current organisation unless `project` narrows it. Scoping is
        applied before filtering, so nothing the caller could not open is listed or counted.

        Order: `sort` if given, else the query's own `sort by:`, else relevance when there is
        free text, else newest first; the issue id breaks ties. With `group_by`, rows come
        group by group and `meta.groups` carries every group's count over the whole filtered
        set (collapsed groups included); each row carries `group`. A multi-valued field
        (`assignee`, `tag`) lists an issue once per value, and `pagination.total` is then the
        sum of the group counts. `due` groups by Overdue / Today / This week / Later / No due
        date in the caller's timezone.

        `group_limit` keeps at most that many rows of each group, so one large group cannot
        push the others off the first page; `meta.groups` and `pagination.total` still count
        the whole filtered set, and `has_more` only the rows the cap leaves reachable.

        A session's non-empty query is remembered for autocomplete (the newest 20); a personal
        access token's is not.

        `deleted=true` lists soft-deleted issues of one `project` still inside the 14-day
        restore window, newest deletion first (Project Admin); `q` does not apply to it.
      tags: [issues]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - $ref: '#/components/parameters/SearchQuery'
        - { name: project, in: query, schema: { type: string, example: PMS }, description: 'Only this project. Required with `deleted=true`.' }
        - { name: group_by, in: query, schema: { type: string, example: 'custom:severity' }, description: 'project, status, priority, type, assignee, tag, sprint, due, or `custom:<slug>` for a select, multi-select, user, multi-user or checkbox field in scope (otherwise `400 search.not_groupable` with the groupable ones in `valid_values`). A custom group''s empty label is the field''s; a checkbox groups as Yes and No.' }
        - { name: group_limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, example: 10 }, description: 'Only with `group_by`: at most this many rows from each group. Ignored without `group_by`.' }
        - $ref: '#/components/parameters/SearchSort'
        - { name: deleted, in: query, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of issues.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Issue'
                            - properties:
                                group: { type: [string, 'null'], description: 'Only with `group_by`: the group value this row is listed under; `null` is the empty group.' }
        '400': { $ref: '#/components/responses/QueryInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
    post:
      summary: Create an issue
      description: |
        Contributor and up; not in an archived project. Everything in one call. Omitted
        status, priority and type take the project defaults. The key comes from the project's
        counter in the same transaction, so numbers never skip. The creator and every assignee
        start watching. `@username` mentions in the description are recorded. Writes a
        `created` history entry. `tags` and `links` are applied in the same transaction, as
        their own routes would apply them: any refusal creates nothing. Send
        `Idempotency-Key` to make a retry safe.
      tags: [issues]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, title]
              properties:
                project: { type: string, example: PMS }
                title: { type: string, minLength: 1, maxLength: 500 }
                description_md: { type: [string, 'null'], description: 'Markdown. 256KB hard limit (`issue.description_too_large`); 64KB is a client-side warning only.' }
                status: { type: string, description: 'Status name, case-insensitive.' }
                priority: { type: string, description: 'Priority name, case-insensitive.' }
                type: { type: string, description: 'Type name, case-insensitive.' }
                assignees: { type: array, maxItems: 50, items: { type: string }, description: 'Usernames, `@` optional. Replaces the whole set. Each must be able to open the issue.' }
                estimate:
                  description: Integer minutes, or a duration such as `1d 4h` read with the organisation's workday and workweek. `null` clears.
                  oneOf:
                    - { type: integer, minimum: 0 }
                    - { type: string, example: 1d 4h }
                    - { type: 'null' }
                start_date: { type: [string, 'null'], format: date, description: 'A calendar date, never timezone-shifted.' }
                due_date: { type: [string, 'null'], format: date }
                story_points: { type: [integer, 'null'], minimum: 0, maximum: 999, description: '`null` clears.' }
                sprint: { type: [string, 'null'], example: September 2026, description: "A sprint's name or slug; `null` is the backlog. A completed sprint takes no new issues (`409 sprint.completed`); unknown is `issue.unknown_sprint` with the planned and active sprints in `valid_values`. Changing it writes `sprint_changed`, and the issue lands at the bottom of its new container." }
                parent: { type: [string, 'null'], example: PMS-12, description: 'Parent issue key, same project. Depth at most 3 (Epic → Task → Subtask), no cycles. Needs the set-parent capability. `null` clears.' }
                tags: { $ref: '#/components/schemas/TagInputs' }
                links:
                  type: array
                  maxItems: 7
                  description: 'Links written with the issue, with the rules and errors of `POST /v1/issues/{key}/links` (errors name `links`). A `subtask of` link sets the parent, so it cannot be combined with `parent`.'
                  items:
                    type: object
                    required: [link, issues]
                    properties:
                      link: { $ref: '#/components/schemas/IssueLinkName' }
                      issues: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
                attachment_ids: { $ref: '#/components/schemas/AttachmentIds' }
                custom_fields: { $ref: '#/components/schemas/CustomFieldsInput' }
      responses:
        '201':
          description: The issue.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '400':
          description: '`issue.unknown_status` / `unknown_priority` / `unknown_type` (with `valid_values`), `issue.unknown_assignee`, `issue.invalid_duration`, `issue.dates_out_of_order`, `issue.description_too_large`, `issue.parent_not_found`, `issue.parent_other_project`, `issue.parent_self`, `issue.hierarchy_cycle`, `issue.hierarchy_too_deep`, `tag.invalid`, a link error (`link.unknown`, `link.target_not_found`, `link.cycle`, `link.one_parent`, `link.parent_conflict`), `attachment.not_a_draft`, a custom field error (`custom_field.unknown`, `custom_field.invalid_value`, `custom_field.out_of_range`, `custom_field.unknown_option` and `custom_field.unknown_user` with `valid_values`, `custom_field.too_many_values`, `custom_field.not_applicable`, `custom_field.required` — `field` is `custom_fields.<slug>`), or validation.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
        '409':
          description: '`project.archived`, `link.exists` (the same link twice in `links`), `attachment.upload_incomplete`, `attachment.issue_limit`, or `idempotency.in_progress`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }

  /v1/issues/export.csv:
    get:
      x-mcp-exempt: download
      summary: Export issues as CSV
      description: |
        The list's own query and order, streamed without an envelope (api-conventions.md §
        Rules), capped at 10,000 rows. Columns default to `key, title, project, status,
        priority, type, assignees, created_by, created_at, updated_at, resolved_at,
        start_date, due_date, estimation, spent_time, story_points, sprint, vote_count`; `sprint` is
        the sprint's name, empty for the backlog; durations render as `1d 4h` with the organisation's calendar, and formula-leading cells are
        quoted. A bad query fails with the error envelope before the first byte.
      tags: [issues]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - $ref: '#/components/parameters/SearchQuery'
        - { name: project, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/SearchSort'
        - { name: columns, in: query, schema: { type: string, example: 'key,title,status,custom:severity' }, description: 'Comma-separated subset of the default columns, in the order wanted, plus any `custom:<slug>`: options and people by name, several joined with `, `, durations as `1d 4h`, checkboxes `true` / `false`.' }
      responses:
        '200':
          description: The CSV file.
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="acme-issues-2026-09-24.csv"' }
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/QueryInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }

  /v1/issues/figures:
    get:
      summary: Counts for the dashboard and project pages
      description: |
        Figures over the same scoped query as the list — `q=` for the organisation,
        `q=assignee: me` for My work, `project=PMS` for a project page. "Open" means
        unresolved. The 7-day windows run back from now; `logged_minutes_this_week` is the
        caller's own time on these issues in the organisation's current week. Always a
        collection: one element with `project: null`, or with `per=project` one per project in
        scope, zeros included.
      tags: [issues]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - $ref: '#/components/parameters/SearchQuery'
        - { name: project, in: query, schema: { type: string } }
        - { name: per, in: query, schema: { type: string, enum: [project] } }
      responses:
        '200':
          description: The figures.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/IssueFigures' } }
        '400': { $ref: '#/components/responses/QueryInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }

  /v1/issues/bulk-update:
    post:
      summary: Update up to 500 issues at once
      description: |
        Contributor and up in each issue's project. The same field semantics as `PATCH
        /v1/issues/{key}` (title and description excluded), plus `add_assignees` and
        `remove_assignees` applied on top of each issue's current set. Each issue is saved in
        its own transaction and recorded in its history like a single edit, so one refusal
        never undoes the others: every key gets a result, `failed` ones with the error a
        single PATCH would have answered. A key listed twice refuses the whole request.
      tags: [issues]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issues, changes]
              properties:
                issues: { type: array, minItems: 1, maxItems: 500, items: { type: string, example: PMS-118 } }
                changes:
                  type: object
                  minProperties: 1
                  properties:
                    status: { type: string }
                    priority: { type: string }
                    type: { type: string }
                    assignees: { type: array, items: { type: string }, description: Replaces the whole set. }
                    add_assignees: { type: array, items: { type: string } }
                    remove_assignees: { type: array, items: { type: string } }
                    estimate: { oneOf: [{ type: integer }, { type: string }, { type: 'null' }] }
                    start_date: { type: [string, 'null'], format: date }
                    due_date: { type: [string, 'null'], format: date }
                    story_points: { type: [integer, 'null'], minimum: 0, maximum: 999 }
                    sprint: { type: [string, 'null'], description: "A sprint's name or slug; `null` is the backlog." }
                    parent: { type: [string, 'null'], example: PMS-12, description: 'Parent issue key, same project. Depth at most 3 (Epic → Task → Subtask), no cycles. Needs the set-parent capability. `null` clears.' }
                    custom_fields: { $ref: '#/components/schemas/CustomFieldsInput' }
      responses:
        '200':
          description: One result per issue, in request order.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/BulkUpdateResult' } }
        '400':
          description: '`issue.bulk_duplicate`, or validation (more than 500 issues, no change).'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/search/suggest:
    get:
      summary: Autocomplete for the query language
      description: |
        Completions for the token under `caret` (default: the end), in the order the dropdown
        shows them — attributes with their description, values grouped by source (from the
        readable projects only), saved searches, recent searches. `insert` replaces the
        `replace` span of `q`; the first item is what `Tab` accepts. `kind=articles` completes the
        knowledge base's vocabulary instead (tag, status, people, parent titles; no saved or
        recent searches).
      tags: [search]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - { name: q, in: query, schema: { type: string, maxLength: 2000, default: '' } }
        - { name: caret, in: query, schema: { type: integer, minimum: 0 } }
        - { name: kind, in: query, schema: { type: string, enum: [issues, articles], default: issues } }
      responses:
        '200':
          description: The suggestions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Suggestion' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/search/recent:
    delete:
      x-mcp-exempt: session
      summary: Forget the caller's recent searches in this organisation
      tags: [search]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
      responses:
        '200':
          description: How many were forgotten.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: object, required: [cleared], properties: { cleared: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/saved-views:
    get:
      summary: Saved views the caller can see
      description: Their own of any visibility, every org-visible view, and project views of readable projects; by position.
      tags: [saved-views]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
      responses:
        '200':
          description: The views.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/SavedView' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Save a view
      description: |
        Private views for everyone; project- and org-visible ones from Contributor up (in that
        project, or in any project for an org view). The query is checked like a search and
        stored in canonical form with its AST. A name already visible to the caller, compared
        case-insensitively, is `409 saved_view.name_taken`, so `#{Name}` stays unambiguous
        for its author.
      tags: [saved-views]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, query]
              properties:
                name: { type: string, minLength: 1, maxLength: 100, description: No braces. }
                query: { type: string, maxLength: 2000 }
                visibility: { type: string, enum: [private, project, org], default: private }
                project: { type: [string, 'null'], description: Project key; required for project visibility. }
                sort: { type: string, example: 'priority, updated desc' }
                columns: { type: array, items: { type: string } }
      responses:
        '201':
          description: The view.
          content: { application/json: { schema: { $ref: '#/components/schemas/SavedViewEnvelope' } } }
        '400':
          description: A query error on `query` or `sort` (see `QueryInvalid`), `saved_view.project_required`, or validation.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
        '409':
          description: '`saved_view.name_taken`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/saved-views/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The view's name, URL-encoded, case-insensitive. Where names repeat across people, the caller's own wins, then project views, then org views.
        schema: { type: string, example: My open bugs }
    get:
      summary: One saved view
      tags: [saved-views]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
      responses:
        '200':
          description: The view.
          content: { application/json: { schema: { $ref: '#/components/schemas/SavedViewEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SavedViewNotFound' }
    patch:
      summary: Change a saved view
      description: |
        Private views by their owner; shared ones by their owner (Contributor up) or an admin —
        the Project Admin of a project view, an Org Admin for an org view. Changing visibility
        or project is checked as a new share. A query that would reach this view again through
        `#{…}` is `query.saved_view_cycle`.
      tags: [saved-views]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                query: { type: string }
                visibility: { type: string, enum: [private, project, org] }
                project: { type: [string, 'null'] }
                sort: { type: [string, 'null'] }
                columns: { type: array, items: { type: string } }
                position: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The view.
          content: { application/json: { schema: { $ref: '#/components/schemas/SavedViewEnvelope' } } }
        '400':
          description: A query error, `saved_view.project_required`, or validation.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SavedViewNotFound' }
        '409':
          description: '`saved_view.name_taken`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      summary: Delete a saved view
      description: Same rule as editing. Answers the view as it was. A query that still references it by name then fails with `query.invalid_value`.
      tags: [saved-views]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
      responses:
        '200':
          description: The deleted view.
          content: { application/json: { schema: { $ref: '#/components/schemas/SavedViewEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SavedViewNotFound' }

  /v1/issues/{key}:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Read an issue
      description: A soft-deleted issue answers `404` like one that never existed.
      tags: [issues]
      responses:
        '200':
          description: The issue.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
    patch:
      summary: Update an issue
      description: |
        An absent key leaves a field alone; `null` clears it. `status` needs the change-status
        capability, `assignees` the assign capability, everything else update — all Contributor
        and up. Entering a `done` or `cancelled` status stamps `resolved_at`; leaving clears it;
        moving between two resolved statuses keeps it. Newly assigned people start watching.
        One save is one `change_group_id`; the same actor changing the same field again within
        five minutes of the first change rewrites that entry, and a change back to the original
        value deletes it. A save that changes nothing writes nothing.

        Changing `parent` writes `parent_changed` (`{ "key": … }` or `null` on each side) on
        this issue, and `linked` / `unlinked` with `{ "link": "parent for", "issue": … }` on the
        new and old parent.
      tags: [issues]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 500 }
                description_md: { type: [string, 'null'], description: 'Markdown. 256KB hard limit (`issue.description_too_large`); 64KB is a client-side warning only.' }
                status: { type: string, description: 'Status name, case-insensitive.' }
                priority: { type: string, description: 'Priority name, case-insensitive.' }
                type: { type: string, description: 'Type name, case-insensitive.' }
                assignees: { type: array, maxItems: 50, items: { type: string }, description: 'Usernames, `@` optional. Replaces the whole set. Each must be able to open the issue.' }
                estimate:
                  description: Integer minutes, or a duration such as `1d 4h` read with the organisation's workday and workweek. `null` clears.
                  oneOf:
                    - { type: integer, minimum: 0 }
                    - { type: string, example: 1d 4h }
                    - { type: 'null' }
                start_date: { type: [string, 'null'], format: date, description: 'A calendar date, never timezone-shifted.' }
                due_date: { type: [string, 'null'], format: date }
                story_points: { type: [integer, 'null'], minimum: 0, maximum: 999, description: '`null` clears.' }
                sprint: { type: [string, 'null'], example: September 2026, description: "A sprint's name or slug; `null` is the backlog. A completed sprint takes no new issues (`409 sprint.completed`); unknown is `issue.unknown_sprint` with the planned and active sprints in `valid_values`. Changing it writes `sprint_changed`, and the issue lands at the bottom of its new container." }
                parent: { type: [string, 'null'], example: PMS-12, description: 'Parent issue key, same project. `null` clears.' }
                custom_fields: { $ref: '#/components/schemas/CustomFieldsInput' }
      responses:
        '200':
          description: The issue after the change.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '400':
          description: As for create.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
        '409':
          description: '`project.archived`, or `idempotency.in_progress`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      summary: Delete an issue
      description: |
        Project Admin and up. A soft delete: the issue is restorable for 14 days, then the
        nightly `issues.purge` removes it with its comments, work items, attachments and
        history. Writes a `deleted` history entry.
      tags: [issues]
      responses:
        '200':
          description: The issue in its final state, with `deleted_at` and `restorable_until`.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
        '409':
          description: '`project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/issues/{key}/restore:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    post:
      summary: Restore a deleted issue
      description: |
        Project Admin and up, within 14 days of the delete. Idempotent on a live issue. Past
        the window, or for a caller who cannot delete, it answers `404`. Writes `restored`.
      tags: [issues]
      responses:
        '200':
          description: The issue, live again.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
        '409':
          description: '`project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/issues/{key}/star:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    put:
      summary: Star an issue
      description: Every role, Observer included — a personal signal, even in an archived project. Idempotent. A star implies a watch; unstarring leaves the watch.
      tags: [issues]
      responses:
        '200':
          description: The issue, with the caller's `me` flags.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
    delete:
      summary: Undo star
      description: Idempotent.
      tags: [issues]
      responses:
        '200':
          description: The issue, with the caller's `me` flags.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }

  /v1/issues/{key}/vote:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    put:
      summary: Vote on an issue
      description: Every role, Observer included — a personal signal, even in an archived project. Idempotent. One vote per person; `vote_count` moves with it.
      tags: [issues]
      responses:
        '200':
          description: The issue, with the caller's `me` flags.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
    delete:
      summary: Undo vote
      description: Idempotent.
      tags: [issues]
      responses:
        '200':
          description: The issue, with the caller's `me` flags.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }

  /v1/issues/{key}/watch:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    put:
      summary: Watch an issue
      description: Every role, Observer included — a personal signal, even in an archived project. Idempotent. The caller only; see `/watchers` for others.
      tags: [issues]
      responses:
        '200':
          description: The issue, with the caller's `me` flags.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
    delete:
      summary: Undo watch
      description: Idempotent.
      tags: [issues]
      responses:
        '200':
          description: The issue, with the caller's `me` flags.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }

  /v1/issues/{key}/watchers:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Watchers of an issue
      description: Every role. `source` is `auto` for a watch added by creating, being assigned or commenting, `explicit` otherwise.
      tags: [issues]
      responses:
        '200':
          description: The watchers.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/IssueWatcher' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
    post:
      summary: Add a watcher
      description: Adding yourself is a personal signal (every role); adding someone else needs Contributor and up. The person must be able to open the issue.
      tags: [issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, maxLength: 40 }
      responses:
        '201':
          description: The watcher.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueWatcherEnvelope' } } }
        '400':
          description: '`issue.watcher_not_in_project`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IssueNotFound' }

  /v1/issues/{key}/watchers/{username}:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/Username'
      - $ref: '#/components/parameters/XOrganization'
    delete:
      summary: Remove a watcher
      description: Removing yourself is a personal signal; removing someone else needs Contributor and up. A later new assignment adds the person back.
      tags: [issues]
      responses:
        '200':
          description: The removed watcher.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueWatcherEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`issue.not_watching`, or `issue.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/issues/{key}/voters:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Voters of an issue
      tags: [issues]
      responses:
        '200':
          description: Everyone who voted, oldest vote first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/MemberRef' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }

  /v1/issues/{key}/activity:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: History of an issue
      description: |
        Cursor-paged, oldest first by first touch, so the order never reshuffles. Group
        entries by `change_group_id` to render one save as one entry; show `updated_at` as the
        time. `old_value` / `new_value` are snapshots taken at write time: `{ "name": … }` for a
        status, priority or type, a sorted username array for `assignees`, minutes for
        `estimate`, dates as `YYYY-MM-DD`, text for `title`; `description` carries none.

        Other kinds: `commented`, `comment_edited` and `comment_deleted` carry
        `new_value: { "comment_id": … }`, and the first two embed the live `comment`. A deleted
        comment vanishes: its `commented` and `comment_edited` entries are no longer listed or
        counted, and only `comment_deleted` remains. `linked` / `unlinked` carry an
        `IssueLinkSnapshot`, `{ "link": "depends on", "issue": "PMS-3" }` read from this issue;
        `issue` is `null` when the other issue is in a project the caller cannot read, and the
        entry is still listed and counted. `tagged` /
        `untagged` `{ "name": … }`, `parent_changed` `{ "key": … }` or `null`. `time_logged`
        carries a `WorkItemSnapshot` — `new_value` only when time was added, both sides when a
        record was edited, `old_value` only when one was deleted. None of these coalesce, and a
        `commented` entry ends the coalescing window for every earlier change.
      tags: [issues]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: '`meta.pagination.next_cursor` from the previous page.' }
        - $ref: '#/components/parameters/Limit'
        - name: kind
          in: query
          description: Only these kinds; repeat for several. The Comments tab asks for `commented`, History for the rest.
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/IssueActivity/properties/kind' } }
      responses:
        '200':
          description: One page of history.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/IssueActivity' } }
        '400':
          description: '`activity.invalid_cursor`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }

  /v1/issues/{key}/tasks/toggle:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    post:
      x-mcp-exempt: editor
      summary: Tick a task checkbox in the description
      description: |
        Sets the `index`-th task checkbox of the description (document order, as the renderer's
        `data-task` attribute numbers them) under the issue's row lock, so a concurrent edit is
        never lost. The update capability, as for any description edit, and recorded as one.
      tags: [issues]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ToggleTask' } } }
      responses:
        '200':
          description: The issue after the change.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '400':
          description: '`issue.no_task`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
        '409':
          description: '`project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/issues/refs:
    get:
      x-mcp-exempt: session
      summary: Issue chips by key, or for the editor's issue picker
      description: |
        With `keys`, the issues those keys name, in the order given — for rendering `PMS-12`
        references in markdown, linked and struck through when `resolved`. Without, the `#`
        picker: `q` matches a key prefix (`PMS-1` finds PMS-1, PMS-12…; a bare number within
        `project`) or a title substring, the `project` first, then most recently updated. An
        empty `q` lists recent issues. Only live issues in projects the caller can read; the
        rest are silently absent.
      tags: [issues]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - { name: keys, in: query, schema: { type: string, example: 'PMS-1,PMS-12' }, description: 'Comma-separated issue keys, at most 200.' }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: project, in: query, schema: { type: string, example: PMS }, description: The project the editor is in; ranked first. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Chips.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/IssueRef' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/issues/{key}/comments:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Comments on an issue
      description: Every role. Cursor-paged, oldest first. Deleted comments are never listed.
      tags: [comments]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: '`meta.pagination.next_cursor` from the previous page.' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of comments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        '400':
          description: '`activity.invalid_cursor`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
    post:
      summary: Comment on an issue
      description: |
        Contributor and up; not in an archived project. Markdown, 256KB at most. In one
        transaction: the comment, `comment_count` + 1, the issue's `updated_at` (not its
        `updated_by`), an automatic watch for the author, a `mentions` row for each `@username`
        naming a live member of the organisation, and a `commented` history entry — which ends
        the coalescing window for every earlier change. `PMS-123` references are not stored;
        render them with `GET /v1/issues/refs`.
      tags: [comments]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body_md]
              properties:
                body_md: { type: string }
                attachment_ids: { $ref: '#/components/schemas/AttachmentIds' }
      responses:
        '201':
          description: The comment.
          content: { application/json: { schema: { $ref: '#/components/schemas/CommentEnvelope' } } }
        '400':
          description: '`comment.body_empty`, `comment.body_too_large`, `attachment.not_a_draft`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
        '409':
          description: '`project.archived`, or `idempotency.in_progress`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/issues/{key}/comments/{id}:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/CommentId'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Read a comment
      tags: [comments]
      responses:
        '200':
          description: The comment.
          content: { application/json: { schema: { $ref: '#/components/schemas/CommentEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/CommentNotFound' }
    patch:
      summary: Edit a comment
      description: |
        A Contributor edits their own; Project Admin and up edit anyone's. Sets `edited_at`,
        replaces the comment's mentions and writes `comment_edited`. The same body is not an
        edit and writes nothing.
      tags: [comments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body_md]
              properties:
                body_md: { type: string }
      responses:
        '200':
          description: The comment.
          content: { application/json: { schema: { $ref: '#/components/schemas/CommentEnvelope' } } }
        '400':
          description: '`comment.body_empty`, `comment.body_too_large`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CommentNotFound' }
        '409':
          description: '`project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      summary: Delete a comment
      description: |
        Own for a Contributor, anyone's for Project Admin and up. A soft delete that vanishes:
        the comment leaves the list, `comment_count` and the history (only `comment_deleted`
        remains), and its mentions are dropped. There is no restore.
      tags: [comments]
      responses:
        '200':
          description: The comment in its final state, with `deleted_at`.
          content: { application/json: { schema: { $ref: '#/components/schemas/CommentEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CommentNotFound' }
        '409':
          description: '`project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/issues/{key}/comments/{id}/tasks/toggle:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/CommentId'
      - $ref: '#/components/parameters/XOrganization'
    post:
      x-mcp-exempt: editor
      summary: Tick a task checkbox in a comment
      description: An edit under the edit rules (own for a Contributor), with the edited marker and a `comment_edited` entry.
      tags: [comments]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ToggleTask' } } }
      responses:
        '200':
          description: The comment.
          content: { application/json: { schema: { $ref: '#/components/schemas/CommentEnvelope' } } }
        '400':
          description: '`issue.no_task`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CommentNotFound' }

  /v1/issues/{key}/work-items:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Time logged on an issue
      description: |
        Every role; readable while time tracking is off. Cursor-paged, in the order the work
        happened (`work_date`, then the order it was written). `include=subtasks` adds the
        records of every live subtask beneath the issue, each naming its own `issue`, so the
        records add up to the issue's `spent_minutes`; without it only this issue's own.
      tags: [time-tracking]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: '`meta.pagination.next_cursor` from the previous page.' }
        - $ref: '#/components/parameters/Limit'
        - { name: include, in: query, schema: { type: string, enum: [subtasks] } }
      responses:
        '200':
          description: One page of work items.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemListEnvelope' } } }
        '400':
          description: '`activity.invalid_cursor`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
    post:
      summary: Log time on an issue
      description: |
        Contributor and up log their own time (`time:write` on a token); naming another
        `author` needs Project Admin, and the author must be someone who could log their own
        time here (`GET /v1/projects/{key}/work-authors`). Refused while the project's time
        tracking is off or it is archived.

        One request carries any number of `records` sharing the author, work type and note. A
        record is a single `work_date`, or a `from`–`to` range that writes **one independent row
        per working day**, each with the record's `duration`: working days are the
        organisation's `workweek_days` counted from `week_starts_on`, so Monday–Friday by
        default. A range may span at most 62 days and must contain a working day. `duration`
        is minutes or `1w 1d 1h 1m`, read with the organisation's workday and workweek.
        `work_type` absent takes the project's default; `null` logs none. The note is markdown,
        16 KB at most; its `@username` mentions are stored per row.

        In one transaction: the rows, the issue's `updated_at` (not its `updated_by`),
        `spent_minutes` on the issue and every ancestor, and one `time_logged` entry per row,
        all in one change group. Answers every row written, in date order.
      tags: [time-tracking]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                author: { type: string, maxLength: 40, description: 'A username, with or without `@`. Absent: the caller.' }
                work_type: { type: [string, 'null'], maxLength: 100, description: 'A work type name, matched without regard to case.' }
                description_md: { type: string, description: 'Markdown, 16 KB at most.' }
                records:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required: [work_date, duration]
                        properties:
                          work_date: { type: string, format: date }
                          duration: { $ref: '#/components/schemas/DurationInput' }
                      - type: object
                        additionalProperties: false
                        required: [from, to, duration]
                        properties:
                          from: { type: string, format: date }
                          to: { type: string, format: date }
                          duration: { $ref: '#/components/schemas/DurationInput' }
                attachment_ids:
                  allOf: [{ $ref: '#/components/schemas/AttachmentIds' }]
                  description: Drafts claimed by the first row written.
                attributes: { $ref: '#/components/schemas/WorkItemAttributesInput' }
            example:
              work_type: Testing
              description_md: Regression pass on checkout
              records:
                - { work_date: '2026-09-21', duration: 2h }
                - { from: '2026-09-22', to: '2026-09-25', duration: 1h 30m }
      responses:
        '201':
          description: Every row written.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemListEnvelope' } } }
        '400':
          description: '`work_item.invalid_duration`, `work_item.unknown_work_type` (with `valid_values`), `work_item.unknown_author`, `work_item.note_too_large`, `work_item.range_out_of_order`, `work_item.range_too_long`, `work_item.range_no_working_days`, `work_item_attribute.unknown` / `unknown_value` (with `valid_values`), or validation. `field` names the record, e.g. `records.1.duration`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
        '409':
          description: '`time_tracking.disabled`, `project.archived`, or `idempotency.in_progress`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/issues/{key}/work-items/{id}:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/WorkItemId'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Read a work item
      tags: [time-tracking]
      responses:
        '200':
          description: The work item.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/WorkItemNotFound' }
    patch:
      summary: Edit a work item
      description: |
        A Contributor edits the records they are the author of; Project Admin and up edit
        anyone's, and only they may change `author`. Refused while time tracking is off or the
        project is archived. An edit that changes nothing writes nothing; otherwise one
        `time_logged` entry with both snapshots, the rollup when `duration` changed, and the
        mentions when the note changed.
      tags: [time-tracking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                author: { type: string, maxLength: 40 }
                work_date: { type: string, format: date }
                duration: { $ref: '#/components/schemas/DurationInput' }
                work_type: { type: [string, 'null'], maxLength: 100, description: '`null` clears it.' }
                attributes: { $ref: '#/components/schemas/WorkItemAttributesInput' }
                description_md: { type: string }
      responses:
        '200':
          description: The work item.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemEnvelope' } } }
        '400':
          description: '`work_item.invalid_duration`, `work_item.unknown_work_type`, `work_item.unknown_author`, `work_item.note_too_large`, `work_item_attribute.unknown`, `work_item_attribute.unknown_value`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/WorkItemNotFound' }
        '409':
          description: '`time_tracking.disabled`, `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      summary: Delete a work item
      description: |
        Own for a Contributor, anyone's for Project Admin and up. A hard delete: the row goes,
        with its mentions; the rollup drops, and `time_logged` keeps the snapshot as `old_value`.
      tags: [time-tracking]
      responses:
        '200':
          description: The work item as it was.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/WorkItemNotFound' }
        '409':
          description: '`time_tracking.disabled`, `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/attachments/presign:
    post:
      summary: Start an upload
      description: |
        Step one of three (docs/file-storage.md § Upload): reserve the row, get a presigned
        `PUT` URL, send the bytes straight to storage with **every** `upload_headers` entry, then
        call `complete`. Bytes never pass through the API.

        Send `issue` to attach to an issue — with `comment_id` or `work_item_id` to hang it on one
        of the issue's comments (the caller must be allowed to edit it) or work items (likewise,
        and time tracking must be on). Send `project` instead for a **draft**: a file for a form
        whose issue, comment or work item does not exist yet. A draft is visible to its uploader
        alone until a create request claims it through `attachment_ids`; unclaimed drafts are
        deleted after two days. Send `project` with `article` (a slug) to attach to a knowledge base
        article, adding `comment_id` for a comment on it; at most 50 files per article.

        Upload is Contributor and up (`issues:write` on a token); never on an archived project.
        `sha256` is the file's SHA-256, base64, and `size` its exact length: both are signed into
        the URL, so storage refuses any other bytes. `width` and `height` (images) are stored so
        rendered markdown can reserve the space.

        Limits, checked here: 100 MB per file; 50 per issue, pending uploads included; and the
        organisation's storage quota, counting uploads still in flight. The first refusal at
        100% emails the Org Admins and Owner.
      tags: [attachments]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignAttachmentRequest' }
            example: { issue: PMS-118, filename: login-bug.png, mime: image/png, size: 48213, sha256: 3q2+7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=, width: 1280, height: 720 }
      responses:
        '201':
          description: The pending attachment and where to put the bytes. The URL works for 15 minutes.
          content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentPresignEnvelope' } } }
        '400':
          description: Validation — exactly one of `issue` or `project`; `comment_id` / `work_item_id` need `issue`, and at most one of them.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`issue.not_found`, `project.not_found`, `comment.not_found` or `work_item.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: '`storage.quota_exceeded` (the message names both ways out: delete files, or connect your own bucket), `storage.byo_unavailable` (the organisation''s own bucket refused its key; an admin must fix it), `attachment.issue_limit`, `project.archived`, `time_tracking.disabled`, or `idempotency.in_progress`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '413':
          description: '`attachment.too_large` — over 100 MB.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '503': { $ref: '#/components/responses/StorageNotConfigured' }

  /v1/attachments/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    post:
      summary: Finish an upload
      description: |
        Only the uploader. The API checks the object exists with the announced size (and
        checksum, where storage reports it), marks the attachment `ready`, adds its size to the
        organisation's usage (a file in the organisation's own bucket counts nothing) and — for
        an attachment on an issue — moves the issue's `updated_at` and writes an `attached`
        history entry. Crossing 95% of the quota emails the Org Admins and Owner once. Completing
        a finished upload answers it unchanged.
      tags: [attachments]
      responses:
        '200':
          description: The attachment, `ready`.
          content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentEnvelope' } } }
        '400':
          description: '`attachment.upload_missing` (nothing was stored — upload again) or `attachment.upload_mismatch` (different bytes).'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AttachmentNotFound' }
        '409':
          description: '`storage.byo_unavailable` — the organisation''s own bucket refused its key on the check; the connection is now `failed` and the admins were emailed.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '503': { $ref: '#/components/responses/StorageNotConfigured' }

  /v1/attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    get:
      summary: Read an attachment
      tags: [attachments]
      responses:
        '200':
          description: The attachment.
          content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AttachmentNotFound' }
    delete:
      summary: Delete an attachment
      description: |
        Own for a Contributor, anyone's for Project Admin and up; a draft or a pending upload is
        its uploader's. Never on an archived project. The file stops serving at once, its size
        leaves the organisation's usage, and an issue attachment writes a `detached` history
        entry; the object itself is removed by the hourly sweep. Attachments are never edited —
        replacing one is a delete and an upload.
      tags: [attachments]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The attachment in its final state, with `deleted_at`.
          content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AttachmentNotFound' }
        '409':
          description: '`project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/issues/{key}/attachments:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Attachments of an issue
      description: |
        Every role. Every `ready` attachment on the issue, its comments and its work items
        (each naming its `comment_id` or `work_item_id`), oldest first — at most 50, so unpaged.
        `inline` marks the files the description or a live comment links to: the list hides
        those by default behind *Hidden files N*.
      tags: [attachments]
      responses:
        '200':
          description: The attachments.
          content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentListEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }

  /v1/issues/{key}/comments/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/CommentId'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Attachments of a comment
      tags: [attachments]
      responses:
        '200':
          description: The comment's attachments.
          content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentListEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/CommentNotFound' }

  /v1/issues/{key}/work-items/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/WorkItemId'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Attachments of a work item
      tags: [attachments]
      responses:
        '200':
          description: The work item's attachments.
          content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentListEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/WorkItemNotFound' }

  /files/{id}/{filename}:
    servers:
      - url: https://files.nothingleft.dev
        description: 'Mounted at the root of the `files.` host; `/files` under `API_BASE_URL` locally (FILES_BASE_URL).'
      - url: http://localhost:4000
    get:
      summary: Serve an attachment
      description: |
        The permanent URL markdown stores (an attachment's `url`). Authorises the session cookie
        or a PAT on every request — may the caller read the issue? — then answers `302` to a
        presigned storage URL that works for five minutes. No envelope on success; errors use
        the error envelope. Bytes never pass through the API, and permission changes apply to
        the next request.

        The signed URL sets the content type, and `inline` disposition only for PNG, JPEG, GIF,
        WebP, AVIF and PDF; everything else, SVG and HTML included, downloads as `attachment`
        with the original filename. `filename` is cosmetic: the id alone finds the file. An
        agent reads `Location` rather than following it.

        A file in the organisation's own bucket is signed against that bucket. When the bucket
        is disconnected or its key is failing, the route answers from the row, without calling
        the bucket; the Attachment's `available` is false in both cases.
      tags: [attachments]
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        '302':
          description: To the file in storage.
          headers:
            Location: { schema: { type: string, format: uri }, description: 'Presigned; five minutes.' }
            Cache-Control: { schema: { type: string, example: 'private, max-age=240' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AttachmentNotFound' }
        '409':
          description: '`storage.byo_unavailable` — the file is in the organisation''s own bucket and its key is failing.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '410':
          description: '`storage.byo_disconnected` — the file is in a bucket the organisation disconnected. Connecting the same bucket (provider, endpoint and name) again serves it again.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '503': { $ref: '#/components/responses/StorageNotConfigured' }

  /v1/issues/{key}/links:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Links of an issue, grouped by type
      description: |
        One group per link name as read from this issue, in the order `parent for`,
        `subtask of`, `depends on`, `is required for`, `duplicates`, `is duplicated by`,
        `relates to`; empty groups are omitted. `parent for` and `subtask of` project
        `parent_id`. Issues in projects the caller cannot read, and deleted issues, are
        neither listed nor counted. `resolved` marks the keys to strike through.
      tags: [issues]
      responses:
        '200':
          description: The groups.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueLinkGroupsEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
    post:
      summary: Link issues
      description: |
        Contributor and up. `link` is one of the seven names, case-insensitive; the targets
        are keys in any project of the organisation the caller can read. Stored once, in the
        canonical outward direction, whichever end adds it — `relates to` between A and B is
        one link. `parent for` / `subtask of` set `parent_id` (the set-parent capability, same
        project, depth ≤ 3) and never write a link row. `depends` refuses a cycle, direct or
        transitive. Every target in one transaction: one refusal links none. Writes `linked`
        on both ends, each in its own reading.
      tags: [issues]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link, issues]
              properties:
                link: { $ref: '#/components/schemas/IssueLinkName' }
                issues: { type: array, minItems: 1, maxItems: 50, items: { type: string, example: PMS-7 } }
      responses:
        '201':
          description: The groups after the change.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueLinkGroupsEnvelope' } } }
        '400':
          description: '`link.unknown` (with `valid_values`), `link.target_not_found`, `link.self`, `link.cycle`, `link.one_parent`, or a hierarchy error as for `PATCH parent`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
        '409':
          description: '`link.exists`, `project.archived`, or `idempotency.in_progress`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/issues/{key}/links/{target}:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - { name: target, in: path, required: true, schema: { type: string, example: PMS-7 } }
      - $ref: '#/components/parameters/XOrganization'
      - { name: link, in: query, required: true, schema: { $ref: '#/components/schemas/IssueLinkName' }, description: 'The link as read from `key`, URL-encoded (`depends%20on`).' }
    delete:
      summary: Unlink issues
      description: Contributor and up. `subtask of` / `parent for` clear `parent_id`. Writes `unlinked` on both ends.
      tags: [issues]
      responses:
        '200':
          description: The groups after the change.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueLinkGroupsEnvelope' } } }
        '400':
          description: '`link.unknown`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`link.not_found`, or `issue.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/issues/{key}/tags:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    post:
      summary: Tag an issue
      description: |
        Contributor and up. Each entry is a name or a slug; its slug (`Needs Review` →
        `needs-review`, colons kept) finds the organisation's existing tag, whose name and
        colour win. A slug nobody has used creates the tag (the create-tag capability, also
        Contributor) with the name as typed and a label colour: the entry's own `color`, else
        the request's `color`, else one derived from the slug. Writes `tagged` for each tag
        newly on the issue; one already there is not a change.
      tags: [tags]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags: { $ref: '#/components/schemas/TagInputs' }
                color: { $ref: '#/components/schemas/LabelColor' }
      responses:
        '200':
          description: The issue, with `tags`.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '400':
          description: '`tag.invalid` — nothing in the name survives slugging.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
        '409':
          description: '`project.archived`, or `idempotency.in_progress`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/issues/{key}/tags/{tag}:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - { name: tag, in: path, required: true, description: 'Name or slug, URL-encoded.', schema: { type: string, example: needs-review } }
      - $ref: '#/components/parameters/XOrganization'
    delete:
      summary: Untag an issue
      description: Contributor and up. Writes `untagged`. The tag itself stays in the organisation.
      tags: [tags]
      responses:
        '200':
          description: The issue, with `tags`.
          content: { application/json: { schema: { $ref: '#/components/schemas/IssueEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`issue.not_tagged`, or `issue.not_found`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/tags:
    get:
      summary: The organisation's tags, with how often each is used
      description: |
        Every member. For tag pickers, the tag management screen and the knowledge base's tag list.
        One vocabulary serves issues and articles. `issue_count` and `article_count` count only
        what the caller can open. `context` ranks tags used on that kind of thing first and never
        hides the rest; with `in_use`, only tags with such a use (either kind without a context).
        `project` narrows the counts to one project. `q` matches name or slug; ties order by slug.
        Rename, recolour, merge and delete come with tag management (6d).
      tags: [tags]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: context, in: query, schema: { type: string, enum: [issue, article] } }
        - { name: project, in: query, schema: { type: string, maxLength: 20 } }
        - { name: in_use, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of tags.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }

  /v1/search:
    get:
      summary: Search issues and articles, in two groups
      description: |
        The global search box. `q` is read twice: by the issue query language for the issues
        group and by the knowledge base's reduced vocabulary for the articles group, each over
        what the caller can open (articles: published, or their own drafts, or drafts in projects
        they administer). One tag reaches both: `tag: payment-outage` returns the outage issues
        and the RCA. A group whose vocabulary cannot read the query (`priority:` for articles,
        `status: draft` for issues) carries that error in `error` and no items; the request is a
        `400` only when both groups refuse it. Keystrokes here are not recorded as recent searches.
      tags: [search]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - { name: q, in: query, schema: { type: string, maxLength: 2000, default: '' } }
        - { name: project, in: query, schema: { type: string, maxLength: 20 }, description: One project instead of every readable one. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 5 }, description: Items per group. }
      responses:
        '200':
          description: Both groups, each with its total.
          content: { application/json: { schema: { $ref: '#/components/schemas/GlobalSearchEnvelope' } } }
        '400': { $ref: '#/components/responses/QueryInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }

  /v1/articles:
    get:
      summary: Search the knowledge base
      description: |
        Every article the caller can open in the current organisation, or in `project`. `q` is
        the article query language — `tag:`, `status:` (Draft, Published, and `#draft`),
        `created by:`, `updated by:`, `created:`, `updated:`, `parent:` (everything beneath the
        named article, by title or slug; `{No parent}` is the top level), `has:`, `sort by:`
        (`created`, `updated`) and free text over titles and bodies. Order: `sort`, else relevance
        with free text, else most recently updated. A value that names nothing in scope is
        `query.invalid_value` with `valid_values`; an issue attribute is `query.unknown_attribute`.
      tags: [articles]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - { name: q, in: query, schema: { type: string, maxLength: 2000 } }
        - { name: project, in: query, schema: { type: string, maxLength: 20 } }
        - { name: sort, in: query, schema: { type: string, maxLength: 200 }, description: 'A `sort by:` value list, e.g. `updated desc`.' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of articles, without bodies.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleSummaryListEnvelope' } } }
        '400': { $ref: '#/components/responses/QueryInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }

  /v1/issues/{key}/articles:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Referenced by — the articles whose body names this issue
      description: |
        Articles in any project of the organisation whose markdown mentions the key (outside code),
        among those the caller can open, by title. Kept when an article is saved, keyed by the text
        of the key, so a key written before its issue existed counts once it does.
      tags: [articles]
      responses:
        '200':
          description: The articles.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleSummaryListEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/IssueNotFound' }

  /v1/projects/{key}/articles:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: A project's knowledge base tree
      description: |
        Depth-first, in sibling order, as the caller sees it: a draft they cannot read is left out,
        and an article beneath it sits under the nearest ancestor they can read (`parent`,
        `depth` and `child_count` follow that view). With `deleted=true`, the soft-deleted
        articles the caller could restore, newest first, each with `restorable_until`.
      tags: [articles]
      parameters:
        - { name: deleted, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: The tree.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleNodeListEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
    post:
      summary: Create an article
      description: |
        Contributor and up; not in an archived project. `status` defaults to `draft`. `parent`,
        `before` and `after` name another article by slug or title; without `before` or `after`
        the article goes last among its siblings. Depth is at most 3. The slug comes from the
        title, suffixed on a clash (`overview-2`); an explicit `slug` that is taken is `409`. Tags
        are created on first use (`tag.create`); `attachment_ids` claims draft uploads. The author
        watches the article.
      tags: [articles]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateArticleRequest' } } }
      responses:
        '201':
          description: The article.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleEnvelope' } } }
        '400':
          description: '`article.hierarchy_too_deep`, `article.anchor_not_sibling`, `article.ambiguous` (with `valid_values`), `article.slug_invalid`, `article.body_too_large`, `tag.invalid`, `attachment.not_a_draft`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }
        '409':
          description: '`article.slug_taken`, `project.archived`, `attachment.article_limit`, `attachment.upload_incomplete`, or `idempotency.in_progress`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/articles/{slug}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ArticleSlug'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Read an article
      description: A draft is readable by its author and Project Admins and up; anyone else gets `404`.
      tags: [articles]
      responses:
        '200':
          description: The article.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }
    patch:
      summary: Edit, publish, reorder or reparent an article
      description: |
        Partial. Each key is checked against its own cell: `title`, `body_md` and `slug` are *Edit
        article*; `status` is *Publish or unpublish* (publishing sets `published_at`, which a
        return to draft keeps); `parent`, `before` and `after` are *Reorder or reparent* — all
        Contributor and up. `parent: null` moves it to the top level. Renaming keeps the slug; an
        explicit `slug` moves it, and a clash is `409`. A reorder alone changes neither
        `updated_at` nor `updated_by`.
      tags: [articles]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateArticleRequest' } } }
      responses:
        '200':
          description: The article.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleEnvelope' } } }
        '400':
          description: '`article.parent_self`, `article.hierarchy_cycle`, `article.hierarchy_too_deep`, `article.anchor_not_sibling`, `article.ambiguous`, `article.slug_invalid`, `article.body_too_large`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }
        '409':
          description: '`article.slug_taken` or `project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      summary: Delete an article
      description: |
        Soft delete, restorable for 14 days. A Contributor deletes their own; Project Admin and up
        anyone's. With children, `children` is required: `move_up` puts them in the article's place
        under its parent; `delete` removes the whole subtree with it, and needs the right to delete
        every article in it (`403 article.delete_subtree_forbidden` otherwise). A draft the caller
        cannot read counts as no child and is never deleted: it moves up into the article's place.
      tags: [articles]
      parameters:
        - { name: children, in: query, schema: { type: string, enum: [move_up, delete] } }
      responses:
        '200':
          description: The article in its final state.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleEnvelope' } } }
        '400':
          description: '`article.children_choice_required`, with `valid_values`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }
        '409':
          description: '`project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/articles/{slug}/restore:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ArticleSlug'
      - $ref: '#/components/parameters/XOrganization'
    post:
      summary: Restore a deleted article
      description: |
        The most recently deleted article with this slug, within 14 days, by whoever could delete
        it. The articles deleted with it come back with it, which needs the right to delete each
        (`403 article.restore_subtree_forbidden`). A slug taken meanwhile takes a numeric suffix; a
        parent that is gone, or one the branch would now sit more than three levels under, returns it
        to the top level. A live article answers unchanged.
      tags: [articles]
      responses:
        '200':
          description: The article.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }

  /v1/projects/{key}/articles/{slug}/star:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ArticleSlug'
      - $ref: '#/components/parameters/XOrganization'
    put:
      summary: Star an article
      description: Every role that can read it. Starring also watches it.
      tags: [articles]
      responses:
        '200':
          description: The article.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }
    delete:
      summary: Unstar an article
      description: The watch stays.
      tags: [articles]
      responses:
        '200':
          description: The article.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }

  /v1/projects/{key}/articles/{slug}/watch:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ArticleSlug'
      - $ref: '#/components/parameters/XOrganization'
    put:
      summary: Watch an article
      description: Every role that can read it. Creating, editing and commenting watch it automatically.
      tags: [articles]
      responses:
        '200':
          description: The article.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }
    delete:
      summary: Stop watching an article
      tags: [articles]
      responses:
        '200':
          description: The article.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }

  /v1/projects/{key}/articles/{slug}/tags:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ArticleSlug'
      - $ref: '#/components/parameters/XOrganization'
    post:
      summary: Tag an article
      description: |
        Contributor and up. The organisation's tags, shared with issues: by name or slug, matched
        by slug, created on first use. Stamps the article's `updated_at` and `updated_by`.
      tags: [articles]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags: { $ref: '#/components/schemas/TagInputs' }
                color: { $ref: '#/components/schemas/LabelColor' }
      responses:
        '200':
          description: The article.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleEnvelope' } } }
        '400':
          description: '`tag.invalid`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }

  /v1/projects/{key}/articles/{slug}/tags/{tag}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ArticleSlug'
      - { name: tag, in: path, required: true, schema: { type: string }, description: Name or slug. }
      - $ref: '#/components/parameters/XOrganization'
    delete:
      summary: Untag an article
      tags: [articles]
      responses:
        '200':
          description: The article.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`article.not_found` or `article.not_tagged`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/articles/{slug}/tasks/toggle:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ArticleSlug'
      - $ref: '#/components/parameters/XOrganization'
    post:
      x-mcp-exempt: editor
      summary: Tick a task checkbox in the article body
      description: An edit of the body, checked as *Edit article*.
      tags: [articles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [index, checked]
              properties:
                index: { type: integer, minimum: 0 }
                checked: { type: boolean }
      responses:
        '200':
          description: The article.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleEnvelope' } } }
        '400':
          description: '`article.no_task`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }

  /v1/projects/{key}/articles/{slug}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ArticleSlug'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Comments on an article
      description: Everyone who can read the article. Cursor-paged, oldest first.
      tags: [articles]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of comments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ArticleComment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }
    post:
      summary: Comment on an article
      description: |
        *Comment on article*, Contributor and up; a token needs `comments:write`. Mentions resolve
        as on issues; the author watches the article. The article's `updated_at` is unchanged.
      tags: [articles]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body_md]
              properties:
                body_md: { type: string }
                attachment_ids: { $ref: '#/components/schemas/AttachmentIds' }
      responses:
        '201':
          description: The comment.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleCommentEnvelope' } } }
        '400':
          description: '`comment.body_empty`, `comment.body_too_large`, `attachment.not_a_draft`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }
        '409':
          description: '`project.archived`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /v1/projects/{key}/articles/{slug}/comments/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ArticleSlug'
      - $ref: '#/components/parameters/CommentId'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: Read a comment on an article
      tags: [articles]
      responses:
        '200':
          description: The comment.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleCommentEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/CommentNotFound' }
    patch:
      summary: Edit a comment on an article
      description: A Contributor edits their own; Project Admin and up anyone's.
      tags: [articles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body_md]
              properties:
                body_md: { type: string }
      responses:
        '200':
          description: The comment.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleCommentEnvelope' } } }
        '400':
          description: '`comment.body_empty`, `comment.body_too_large`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CommentNotFound' }
    delete:
      summary: Delete a comment on an article
      description: A Contributor deletes their own; Project Admin and up anyone's. Its files go with it.
      tags: [articles]
      responses:
        '200':
          description: The comment in its final state.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArticleCommentEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CommentNotFound' }

  /v1/projects/{key}/articles/{slug}/comments/{id}/tasks/toggle:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ArticleSlug'
      - $ref: '#/components/parameters/CommentId'
      - $ref: '#/components/parameters/XOrganization'
    post:
      x-mcp-exempt: editor
      summary: Tick a task checkbox in a comment on an article
      tags: [articles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [index, checked]
