                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/GanttReport' }
        '400': { $ref: '#/components/responses/ReportInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }

  /v1/reports/gantt/export.csv:
    get:
      x-mcp-exempt: download
      summary: Gantt chart of a project as CSV
      description: |
        The same report as the JSON, without an envelope (api-conventions.md § Rules). Columns:
        `key, title, group, start_date, due_date, status, assignees, depends_on, scheduled` — the missing-dates issues follow with `scheduled` false`. Formula-leading text cells are quoted. Errors use the error envelope.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - { name: project, in: query, required: true, schema: { type: string, example: ACME } }
        - $ref: '#/components/parameters/ReportQuery'
        - $ref: '#/components/parameters/ReportView'
        - { name: group_by, in: query, schema: { type: string, enum: [epic, assignee, none], default: none } }
      responses:
        '200':
          description: The CSV file.
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="acme-gantt-acme-2026-09-27.csv"' }
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ReportInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
  /v1/reports/timesheet:
    get:
      summary: Timesheet
      description: |
        Logged time per author per day (reports.md § 9): one row per author, one column per
        calendar day of the period, totals both ways. `users` absent is everyone with time in
        the period; named users get a row even when empty. Anyone's time on an issue the caller
        can read is visible. At most 62 days.

        Scoped like every report (reports.md § Implementation): the query and saved view pass
        through the search pipeline, scoped to the caller's readable projects before anything is
        counted. Each group carries `query`, the issue-list query for its issues. A report with
        nothing in it answers `200` with `empty`: a message naming the filter, and each filter
        with the query that widens it. Cached per caller for five minutes, invalidated by any
        write in the organisation.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - $ref: '#/components/parameters/ReportQuery'
        - $ref: '#/components/parameters/ReportView'
        - $ref: '#/components/parameters/ReportProjects'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportPeriod'
        - { name: users, in: query, schema: { type: string, example: 'alex,casey,me' }, description: 'Comma-separated usernames or `me`; an unknown one is `400 report.unknown_user` with the members.' }
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/TimesheetReport' }
        '400': { $ref: '#/components/responses/ReportInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }

  /v1/reports/timesheet/export.csv:
    get:
      x-mcp-exempt: download
      summary: Timesheet as CSV
      description: |
        The same report as the JSON, without an envelope (api-conventions.md § Rules). Columns:
        `user, username, <each date>, total, total_minutes` and a `Total` row; durations read `1h 30m``. Formula-leading text cells are quoted. Errors use the error envelope.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - $ref: '#/components/parameters/ReportQuery'
        - $ref: '#/components/parameters/ReportView'
        - $ref: '#/components/parameters/ReportProjects'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportPeriod'
        - { name: users, in: query, schema: { type: string, example: 'alex,casey,me' }, description: 'Comma-separated usernames or `me`; an unknown one is `400 report.unknown_user` with the members.' }
      responses:
        '200':
          description: The CSV file.
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="acme-timesheet-2026-09-21-2026-09-27.csv"' }
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ReportInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
  /v1/reports/timesheet/work-items:
    get:
      summary: The work items behind a timesheet cell
      description: |
        One author's work items in the period on the scoped issues, oldest first: the drill-down
        of a timesheet cell (a period of one day) or row. Same scope parameters as the timesheet.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - $ref: '#/components/parameters/ReportQuery'
        - $ref: '#/components/parameters/ReportView'
        - $ref: '#/components/parameters/ReportProjects'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportPeriod'
        - { name: user, in: query, required: true, schema: { type: string, example: casey }, description: 'A username or `me`.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: The work items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/TimesheetWorkItem' } }
        '400': { $ref: '#/components/responses/ReportInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }

  /v1/notifications:
    get:
      summary: The inbox
      description: |
        The caller's notifications across every organisation they still belong to, **grouped by
        issue or article**: twelve changes to one issue are one entry. Entries are ordered by their
        newest notification and paged by cursor; each carries its newest ten notifications, and the
        subject's own list (`GET /v1/issues/{key}/notifications`) pages the rest. Only notifications
        about something the caller can open now are listed: a project they left, a trashed issue or
        a draft the caller may not read (*Read draft article*: their own from Contributor, anyone's
        from Project Admin) drops out, and comes back if access does. Self-service; a token needs
        `issues:read` (docs/notifications.md § Notification centre).
      tags: [notifications]
      parameters:
        - { name: kind, in: query, schema: { type: string, example: 'mentioned,assigned' }, description: 'Comma-separated notification kinds.' }
        - { name: project, in: query, schema: { type: string, example: PP }, description: 'A project key; in every organisation that has it, unless `org` narrows it to one.' }
        - { name: org, in: query, schema: { type: string, example: acme }, description: 'One organisation by slug; an unknown one is `404 organization.not_found` with the caller''s slugs.' }
        - { name: unread, in: query, schema: { type: boolean }, description: 'Only unread notifications (and the entries that have any).' }
        - { name: cursor, in: query, schema: { type: string }, description: '`meta.pagination.next_cursor` from the previous page.' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of entries. `meta.pagination.total` counts entries, not notifications.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/NotificationGroup' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`organization.not_found` or `project.not_found` for the filter.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/notifications/facets:
    get:
      x-mcp-exempt: session
      summary: What the inbox filters offer
      description: |
        The organisations the reader belongs to, and the projects — in any of them — with at least
        one notification in their inbox under the same read-time checks as the list. For the
        inbox's organisation and project pickers, since a session lists only its current
        organisation's projects. Self-service; a token needs `issues:read`.
      tags: [notifications]
      responses:
        '200':
          description: The organisations and projects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        required: [organizations, projects]
                        properties:
                          organizations:
                            type: array
                            items:
                              type: object
                              required: [slug, name]
                              properties: { slug: { type: string }, name: { type: string } }
                          projects:
                            type: array
                            items:
                              type: object
                              required: [key, name, organization]
                              properties:
                                key: { type: string }
                                name: { type: string }
                                organization:
                                  type: object
                                  required: [slug, name]
                                  properties: { slug: { type: string }, name: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/notifications/unread-count:
    get:
      summary: Unread entries, for the header
      description: Entries (issues and articles) with anything unread, in total and per organisation. Self-service; a token needs `issues:read`.
      tags: [notifications]
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/UnreadCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/notifications/read:
    post:
      summary: Mark notifications read
      description: |
        Marks the caller's unread notifications read: by `ids`, by every notification on the
        `issues` or `articles` named, or with `all: true` everything matching `kind`, `project` and
        `org`. One of the four is required (`400 notification.mark_target_required`). With `org`,
        the `issues` and `articles` named are found in that organisation among the reader's own,
        whatever the session's current organisation. Read state is
        per person; nothing is ever deleted on the caller's behalf. Self-service; a token needs
        `issues:write`.
      tags: [notifications]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids: { type: array, items: { type: integer }, maxItems: 500 }
                issues: { type: array, items: { type: string, example: PP-12 }, maxItems: 500 }
                articles:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [project, slug]
                    properties:
                      project: { type: string, example: PP }
                      slug: { type: string }
                all: { type: boolean, enum: [true] }
                kind: { type: array, items: { $ref: '#/components/schemas/NotificationKind' } }
                project: { type: string }
                org: { type: string }
      responses:
        '200':
          description: How many changed, and the unread counts after.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        required: [marked, unread]
                        properties:
                          marked: { type: integer }
                          unread: { $ref: '#/components/schemas/UnreadCount' }
        '400':
          description: '`notification.mark_target_required`, or `validation_failed`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`issue.not_found`, `article.not_found`, `project.not_found` or `organization.not_found` for a name the caller cannot read.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/notifications/preferences:
    get:
      summary: Notification email preferences
      description: |
        The caller's email choice for every kind, with its area (the settings screen's grouping),
        the options it offers (`reaction` is in-app only, so only `off`) and the *most commonly
        enabled* marker. Every kind is `off` until chosen; in-app notifications are always on.
        Self-service; a token needs `issues:read`.
      tags: [notifications]
      responses:
        '200':
          description: One row per kind.
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferencesEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: Change notification email preferences
      description: |
        `email` sets kinds by name; kinds not named keep their choice. `all: "off"` — the
        "turn everything off" switch — is applied first. Any email for `reaction` is
        `400 notification.email_not_offered` with `valid_values: ["off"]`. The account's
        preferences apply in every organisation. Self-service; a token needs `issues:write`.
      tags: [notifications]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                all: { type: string, enum: ['off'] }
                email:
                  type: object
                  description: 'Kind → `off`, `instant`, `daily_digest` or `weekly_digest`.'
                  propertyNames: { $ref: '#/components/schemas/NotificationKind' }
                  additionalProperties: { $ref: '#/components/schemas/NotificationEmail' }
                  example: { mentioned: instant, commented: daily_digest }
      responses:
        '200':
          description: Every kind, after the change.
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferencesEnvelope' } } }
        '400':
          description: '`notification.email_not_offered`, or `validation_failed`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/notifications/unsubscribe:
    parameters:
      - { name: token, in: query, required: true, schema: { type: string }, description: 'The signed token from the email''s unsubscribe link or `List-Unsubscribe` header.' }
    get:
      x-mcp-exempt: email_link
      summary: What an unsubscribe link turns off
      description: |
        No sign-in: the signed token is the credential, and it can only turn email off. For the
        page the email's link opens, which asks before it acts so a link scanner unsubscribes
        nobody. An instant email's token names its kinds; a digest's names the cadence, and
        `kinds` is every kind on it now.
      tags: [notifications]
      security: []
      responses:
        '200':
          description: 'The kinds, with `applied: false`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/UnsubscribeEnvelope' } } }
        '400':
          description: '`notification.unsubscribe_invalid` — a token that does not verify.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    post:
      x-mcp-exempt: email_link
      summary: Unsubscribe in one click
      description: |
        Turns the token's kinds' email off — for a digest, every kind on its cadence — and nothing
        else. Also the RFC 8058 target of `List-Unsubscribe-Post`: mail clients post
        `List-Unsubscribe=One-Click` as a form. Repeating it is harmless; the token never expires.
      tags: [notifications]
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                List-Unsubscribe: { type: string, enum: [One-Click] }
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: 'The kinds turned off, with `applied: true`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/UnsubscribeEnvelope' } } }
        '400':
          description: '`notification.unsubscribe_invalid`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/issues/{key}/notifications:
    parameters:
      - $ref: '#/components/parameters/IssueKey'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: My notifications on an issue
      description: An inbox entry expanded. Newest first, paged by cursor. Needs *Read issue*; self-service scope `issues:read`.
      tags: [notifications]
      parameters:
        - { name: org, in: query, schema: { type: string, example: acme }, description: 'The organisation the subject is in, when it is not the one the request resolves to (a session''s current organisation): the subject is then found among the reader''s organisations. Unknown, or one the reader does not belong to, is `404 organization.not_found` with their slugs.' }
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: cursor, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of notifications.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/IssueNotFound' }
  /v1/projects/{key}/articles/{slug}/notifications:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/ArticleSlug'
      - $ref: '#/components/parameters/XOrganization'
    get:
      summary: My notifications on an article
      description: An inbox entry expanded, for a knowledge base article. Newest first, paged by cursor; self-service scope `issues:read`.
      tags: [notifications]
      parameters:
        - { name: org, in: query, schema: { type: string, example: acme }, description: 'The organisation the subject is in, when it is not the one the request resolves to (a session''s current organisation): the subject is then found among the reader''s organisations. Unknown, or one the reader does not belong to, is `404 organization.not_found` with their slugs.' }
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: cursor, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of notifications.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ArticleNotFound' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
    pat:
      type: http
      scheme: bearer
      description: Opaque Personal Access Token. No JWT anywhere.

  schemas:
    OrgRole: { type: string, enum: [org_admin, member] }
    ProjectRole: { type: string, enum: [project_admin, contributor, observer] }
    PaletteHue:
      type: string
      description: A palette token name; values live in design/tokens.css.
      enum: [red, orange, amber, yellow, lime, green, teal, cyan, blue, indigo, violet, pink, brown, gray]
    MemberRef:
      type: object
      required: [username, name, avatar_url, former_member, deactivated]
      properties:
        username: { type: string, example: alex }
        name: { type: string }
        avatar_url: { type: [string, 'null'] }
        former_member: { type: boolean, description: 'Removed from the organisation. Render the real name and avatar with a *Former member* chip; never hide them.' }
        deactivated: { type: boolean, description: 'The account is deactivated. The real name still renders, greyed out; the person is offered in no picker.' }
    Seats:
      type: object
      required: [used, free, over]
      properties:
        used: { type: integer, description: Live members. }
        free: { type: [integer, 'null'], description: The plan's free allowance; null when unlimited. }
        over: { type: integer, description: Members beyond the allowance. Nothing is blocked; the UI shows the seat notice. }
    Organization:
      type: object
      required: [slug, name, avatar_url, plan, owner, workday_minutes, workweek_days, week_starts_on, seats, storage, membership, deletion, created_at, updated_at]
      properties:
        slug: { type: string, example: acme-corporation }
        name: { type: string }
        avatar_url: { type: string, description: 'The `/avatars/organization` blob, seeded by the name and computed at read time; not stored.' }
        plan: { type: string, enum: [free, pro, pro_lite, unlimited] }
        owner: { $ref: '#/components/schemas/MemberRef' }
        workday_minutes: { type: integer }
        workweek_days: { type: integer }
        week_starts_on: { type: integer, description: 0 = Sunday … 6 = Saturday }
        seats: { $ref: '#/components/schemas/Seats' }
        storage: { $ref: '#/components/schemas/StorageUsage' }
        membership:
          type: object
          required: [username, org_role, is_owner]
          properties:
            username: { type: string }
            org_role: { $ref: '#/components/schemas/OrgRole' }
            is_owner: { type: boolean }
        deletion:
          description: Set while the Owner's deletion request runs its 14-day grace period; every member sees it.
          oneOf:
            - type: 'null'
            - type: object
              required: [scheduled_at, deletes_at]
              properties:
                scheduled_at: { type: string, format: date-time }
                deletes_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StepUp:
      type: object
      description: Confirms a destructive action. `current_password` for an account with one; `code` (TOTP or recovery code) when two-factor is on.
      properties:
        current_password: { type: string }
        code: { type: string }
    TwoFactorStatus:
      type: object
      required: [enabled, enabled_at, recovery_codes_remaining]
      properties:
        enabled: { type: boolean }
        enabled_at: { type: [string, 'null'], format: date-time }
        recovery_codes_remaining: { type: integer }
    TwoFactorChallengeEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              required: [two_factor_required, expires_at]
              properties:
                two_factor_required: { type: boolean, enum: [true] }
                expires_at: { type: string, format: date-time }
    TwoFactorSetupEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              required: [secret, otpauth_uri]
              properties:
                secret: { type: string, description: Base32, for typing into an authenticator by hand. }
                otpauth_uri: { type: string, example: 'otpauth://totp/Nothing%20Left:alex%40acme.example?secret=…&issuer=Nothing%20Left' }
    TwoFactorRecoveryCodesEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              required: [recovery_codes, enabled_at]
              properties:
                recovery_codes: { type: array, items: { type: string, example: k4m9p-2xq7r }, minItems: 10, maxItems: 10 }
                enabled_at: { type: string, format: date-time }
    OwnershipTransfer:
      type: object
      required: [organization, from, to, created_at, expires_at]
      properties:
        organization:
          type: object
          required: [slug, name, avatar_url]
          properties:
            slug: { type: string }
            name: { type: string }
            avatar_url: { type: string, description: The organisation's generated mark, as on Organization. }
        from: { $ref: '#/components/schemas/MemberRef' }
        to: { $ref: '#/components/schemas/MemberRef' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    OwnershipTransferEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/OwnershipTransfer' }
    PendingOwnershipTransferEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/OwnershipTransfer'
    OrganizationEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/Organization' }
    OrganizationListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/Organization' } }
    Member:
      allOf:
        - $ref: '#/components/schemas/MemberRef'
        - type: object
          required: [email, email_verified, org_role, is_owner, joined_at, invited_by]
          properties:
            email: { type: [string, 'null'], description: 'Shown to org admins, the owner and the member themselves.' }
            email_verified: { type: boolean, description: 'The address is verified. Ownership can only be offered to an active, verified member.' }
            org_role: { $ref: '#/components/schemas/OrgRole' }
            is_owner: { type: boolean }
            joined_at: { type: string, format: date-time }
            invited_by: { type: [string, 'null'], description: The inviter's username. }
    RemovalPreview:
      type: object
      required: [member, open_assigned, resolved_assigned, created, comments, time_logged_minutes, saved_views, sessions, access_tokens, reassign_candidates]
      properties:
        member: { $ref: '#/components/schemas/MemberRef' }
        open_assigned: { type: integer, description: Live issues assigned to them whose status category is not done or cancelled. }
        resolved_assigned: { type: integer, description: Live resolved issues assigned to them; unchanged by removal. }
        created: { type: integer, description: Live issues they created; `created_by` never changes. }
        comments: { type: integer, description: Their live comments. }
        time_logged_minutes: { type: integer, description: Minutes on the work items they authored. }
        saved_views: { type: integer, description: Views they own, of every visibility. }
        sessions: { type: integer, description: Live sessions of the account. }
        access_tokens: { type: integer, description: Live tokens that reach this organisation. }
        reassign_candidates: { type: array, items: { $ref: '#/components/schemas/MemberRef' } }
    RemovalPreviewEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/RemovalPreview' }
    MemberEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/Member' }
    Project:
      type: object
      required: [key, name, slug, description_md, avatar_color, avatar_initials, avatar_url, lead, is_archived, time_tracking_enabled, estimation_field, spent_time_field, key_editable, my_role, knowledge_base, created_at, updated_at]
      properties:
        key: { type: string, example: PP }
        name: { type: string }
        slug: { type: string }
        description_md: { type: [string, 'null'], description: Markdown. }
        avatar_color: { $ref: '#/components/schemas/PaletteHue' }
        avatar_initials: { type: string }
        avatar_url: { type: string, description: 'The `/avatars/project` initials on the electric set with dark text, seeded by the project key and computed at read time. `avatar_color` and `avatar_initials` draw the mark while it loads.' }
        lead:
          oneOf:
            - $ref: '#/components/schemas/MemberRef'
            - type: 'null'
        is_archived: { type: boolean }
        time_tracking_enabled: { type: boolean, description: 'Off hides Estimation, Spent time and logging; logged time is kept.' }
        estimation_field: { oneOf: [{ $ref: '#/components/schemas/CustomFieldRef' }, { type: 'null' }], description: 'The duration custom field that is the Estimation; `null` is the built-in.' }
        spent_time_field: { oneOf: [{ $ref: '#/components/schemas/CustomFieldRef' }, { type: 'null' }], description: 'The duration custom field that shows Spent time; `null` is the built-in.' }
        key_editable: { type: boolean, description: False once the project has its first issue. }
        my_role: { $ref: '#/components/schemas/ProjectRole' }
        knowledge_base:
          type: object
          required: [can_create, can_move]
          description: What the caller may do in the knowledge base as a whole (false in an archived project); each article carries its own `me`.
          properties:
            can_create: { type: boolean }
            can_move: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StatusCategory: { type: string, enum: [backlog, unstarted, started, done, cancelled] }
    LabelColor:
      type: string
      description: |
        A label-grid token name — family and step, 1 palest to 5 deepest. Used by statuses,
        priorities and types; background, text and dot values live in design/tokens.css.
        Omitted on create, it is `gray-2`.
      enum: [gray-1, gray-2, gray-3, gray-4, gray-5, red-1, red-2, red-3, red-4, red-5, orange-1, orange-2, orange-3, orange-4, orange-5, yellow-1, yellow-2, yellow-3, yellow-4, yellow-5, green-1, green-2, green-3, green-4, green-5, teal-1, teal-2, teal-3, teal-4, teal-5, blue-1, blue-2, blue-3, blue-4, blue-5, pink-1, pink-2, pink-3, pink-4, pink-5]
    WorkflowStatus:
      type: object
      required: [name, category, color, short_label, position, is_default, is_archived]
      properties:
        name: { type: string, example: In Progress }
        category: { $ref: '#/components/schemas/StatusCategory' }
        color: { $ref: '#/components/schemas/LabelColor' }
        short_label: { type: string, minLength: 1, maxLength: 1 }
        position: { type: integer }
        is_default: { type: boolean }
        is_archived: { type: boolean }
    WorkflowStatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/WorkflowStatus' }
    Priority:
      type: object
      required: [name, color, short_label, position, is_default]
      properties:
        name: { type: string, example: Normal }
        color: { $ref: '#/components/schemas/LabelColor' }
        short_label: { type: string }
        position: { type: integer }
        is_default: { type: boolean }
    PriorityEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/Priority' }
    IssueType:
      type: object
      required: [name, icon, color, short_label, position, is_default]
      properties:
        name: { type: string, example: Bug }
        icon: { type: [string, 'null'] }
        color: { $ref: '#/components/schemas/LabelColor' }
        short_label: { type: string }
        position: { type: integer }
        is_default: { type: boolean }
    IssueTypeEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/IssueType' }
    WorkType:
      type: object
      required: [name, short_label, position, is_default, is_archived]
      properties:
        name: { type: string, example: Development }
        short_label: { type: string, minLength: 1, maxLength: 1, example: D }
        position: { type: integer }
        is_default: { type: boolean }
        is_archived: { type: boolean }
    WorkTypeEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/WorkType' }
    CustomFieldType:
      type: string
      enum: [text, markdown, number, integer, date, datetime, checkbox, select, multi_select, user, multi_user, url, duration]
    CustomFieldRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, example: original-estimate }
        name: { type: string, example: Original estimate }
    CustomFieldConfig:
      type: object
      additionalProperties: false
      properties:
        min: { type: number, description: '`number` and `integer`.' }
        max: { type: number, description: '`number` and `integer`.' }
        decimals: { type: integer, minimum: 0, maximum: 6, description: '`number`: decimal places allowed.' }
    CustomFieldValueInput:
      description: |
        A value as a request writes it: text; a number (or a numeric string); minutes or `1h 30m` for a
        duration; `YYYY-MM-DD` for a date; an ISO instant for a datetime; `true` / `false` for a
        checkbox; an option's name (case-insensitive) for a select; a username (with or without `@`,
        someone who can open the issue) for a user; a list for the multi types. `null` clears; an empty
        string or list clears too.
      oneOf:
        - { type: string }
        - { type: number }
        - { type: boolean }
        - { type: array, maxItems: 50, items: { type: string } }
        - { type: 'null' }
    CustomFieldsInput:
      type: object
      description: |
        Custom field values keyed by slug or field name. Unknown, archived and read-only (Spent time)
        fields are refused, as is a value for a field that does not apply to the issue's type. On
        create, a field not named takes its default; a required field left empty is `400
        custom_field.required`. When the project's Estimation is a custom field, `estimate` writes it
        too. Every change records `field_changed` with `field: custom:<slug>` and readable snapshots
        (data-model.md § issue_activity), and coalesces.
      additionalProperties: { $ref: '#/components/schemas/CustomFieldValueInput' }
      example: { severity: High, platforms: [Web, iOS], reviewer: casey, launch: '2026-10-01', blocking: true }
    CustomFieldOption:
      type: object
      required: [name, color, position, is_archived]
      properties:
        name: { type: string, example: High }
        color: { $ref: '#/components/schemas/LabelColor' }
        position: { type: integer }
        is_archived: { type: boolean }
    CustomField:
      type: object
      required: [slug, name, type, config, is_required, default_value, empty_label, applies_to, options, position, is_archived, time_role, issue_count, created_at, updated_at]
      properties:
        slug: { type: string, example: severity, description: 'The search attribute (`severity: High`); fixed at creation.' }
        name: { type: string, example: Severity }
        type: { $ref: '#/components/schemas/CustomFieldType' }
        config: { $ref: '#/components/schemas/CustomFieldConfig' }
        is_required: { type: boolean }
        default_value: { $ref: '#/components/schemas/CustomFieldValueInput' }
        empty_label: { type: [string, 'null'], description: '`null` reads "No <name>".' }
        applies_to: { type: array, items: { type: string }, description: 'Issue type names; empty applies to every type.' }
        options: { type: array, items: { $ref: '#/components/schemas/CustomFieldOption' }, description: 'Select and multi-select only; empty for every other type.' }
        position: { type: integer }
        is_archived: { type: boolean }
        time_role: { type: [string, 'null'], enum: [estimation, spent_time, null], description: "Set when the project uses the field as its Estimation or Spent time." }
        issue_count: { type: integer, description: "Issues holding a value, those whose type the field no longer applies to included (so more than a `has:` search finds): what a delete destroys. 0 for the project's Spent time field, which stores nothing." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomFieldEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/CustomField' }
    CreateCustomFieldOption:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { $ref: '#/components/schemas/LabelColor' }
        position: { type: integer, minimum: 0 }
    UpdateCustomFieldOption:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { $ref: '#/components/schemas/LabelColor' }
        position: { type: integer, minimum: 0 }
        is_archived: { type: boolean }
    CreateCustomField:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: '#/components/schemas/CustomFieldType' }
        slug: { type: string, maxLength: 40, pattern: '^[a-z][a-z0-9-]{0,39}$' }
        config: { $ref: '#/components/schemas/CustomFieldConfig' }
        is_required: { type: boolean }
        default_value: { $ref: '#/components/schemas/CustomFieldValueInput' }
        empty_label: { type: [string, 'null'], maxLength: 60 }
        applies_to: { type: array, maxItems: 50, items: { type: string }, description: 'Issue type names; absent or empty applies to every type.' }
        options: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/CreateCustomFieldOption' } }
        position: { type: integer, minimum: 0 }
    UpdateCustomField:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        config: { $ref: '#/components/schemas/CustomFieldConfig' }
        is_required: { type: boolean }
        default_value: { $ref: '#/components/schemas/CustomFieldValueInput' }
        empty_label: { type: [string, 'null'], maxLength: 60 }
        applies_to: { type: array, maxItems: 50, items: { type: string } }
        position: { type: integer, minimum: 0 }
        is_archived: { type: boolean }
    IssueCustomFieldValue:
      type: object
      required: [slug, name, type, empty_label, value]
      description: |
        One custom field of an issue. `value` by type: text, markdown, url → string; number, integer,
        duration (minutes) → number; date → `YYYY-MM-DD`; datetime → ISO instant; checkbox → boolean;
        select → `{name, color}`; multi_select → a list of those; user → MemberRef; multi_user → a list
        of MemberRef. Empty is `null`, or `[]` for the multi types; `empty_label` is for display. A field
        that is the project's Spent time reads the rollup, as `duration`.
      properties:
        slug: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/CustomFieldType' }
        empty_label: { type: string, example: No Severity }
        value: {}
    WorkItemAttributeValue:
      type: object
      required: [name, short_label, position, is_archived]
      properties:
        name: { type: string, example: 'Yes' }
        short_label: { type: string, minLength: 1, maxLength: 1 }
        position: { type: integer }
        is_archived: { type: boolean }
    WorkItemAttribute:
      type: object
      required: [name, position, is_archived, values]
      properties:
        name: { type: string, example: Billable }
        position: { type: integer }
        is_archived: { type: boolean }
        values: { type: array, items: { $ref: '#/components/schemas/WorkItemAttributeValue' } }
    WorkItemAttributeEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/WorkItemAttribute' }
    CreateWorkItemAttributeValue:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        short_label: { type: string, minLength: 1, maxLength: 1 }
        position: { type: integer, minimum: 0 }
    UpdateWorkItemAttributeValue:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        short_label: { type: string, minLength: 1, maxLength: 1 }
        position: { type: integer, minimum: 0 }
        is_archived: { type: boolean }
    CreateWorkItemAttribute:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        position: { type: integer, minimum: 0 }
        values: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/CreateWorkItemAttributeValue' } }
    UpdateWorkItemAttribute:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        position: { type: integer, minimum: 0 }
        is_archived: { type: boolean }
    WorkItemAttributesInput:
      type: object
      description: "The project's own work item attributes by name → a value's name; `null` clears one. Unknown ones are `work_item_attribute.unknown` / `unknown_value` with `valid_values`."
      additionalProperties: { type: [string, 'null'] }
      example: { Billable: 'Yes' }
    Issue:
      type: object
      required: [key, project, title, description_md, status, priority, type, assignees, created_by, updated_by, parent, tags, estimate_minutes, spent_minutes, story_points, story_points_rollup, sprint, subtasks, start_date, due_date, resolved_at, vote_count, comment_count, attachment_count, watcher_count, custom_fields, me, created_at, updated_at, deleted_at, restorable_until]
      properties:
        key: { type: string, example: PMS-118 }
        project:
          type: object
          required: [key, name]
          properties:
            key: { type: string }
            name: { type: string }
        title: { type: string }
        description_md: { type: [string, 'null'], description: Markdown. }
        status:
          type: object
          required: [name, category, color, short_label]
          properties:
            name: { type: string }
            category: { $ref: '#/components/schemas/StatusCategory' }
            color: { $ref: '#/components/schemas/LabelColor' }
            short_label: { type: string }
        priority:
          type: object
          required: [name, color, short_label]
          properties:
            name: { type: string }
            color: { $ref: '#/components/schemas/LabelColor' }
            short_label: { type: string }
        type:
          type: object
          required: [name, icon, color, short_label]
          properties:
            name: { type: string }
            icon: { type: [string, 'null'] }
            color: { $ref: '#/components/schemas/LabelColor' }
            short_label: { type: string }
        assignees: { type: array, items: { $ref: '#/components/schemas/MemberRef' } }
        created_by: { $ref: '#/components/schemas/MemberRef' }
        updated_by: { $ref: '#/components/schemas/MemberRef' }
        parent: { type: [string, 'null'], description: 'Parent issue key, same project.' }
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' }, description: 'By name, case-insensitively.' }
        estimate_minutes: { type: [integer, 'null'], description: "The project's Estimation: its chosen duration custom field when it has one, else the built-in." }
        spent_minutes: { type: integer, description: This issue's work items plus every descendant's. }
        story_points: { type: [integer, 'null'] }
        story_points_rollup: { type: [integer, 'null'], description: "Summed over the live descendants' story points; `null` when none has any." }
        sprint:
          oneOf:
            - { $ref: '#/components/schemas/SprintRef' }
            - { type: 'null' }
          description: '`null`: the backlog (Unscheduled).'
        subtasks: { $ref: '#/components/schemas/SubtaskProgress' }
        start_date: { type: [string, 'null'], format: date }
        due_date: { type: [string, 'null'], format: date }
        resolved_at: { type: [string, 'null'], format: date-time }
        vote_count: { type: integer }
        comment_count: { type: integer }
        attachment_count: { type: integer, description: 'Ready files on the issue, its comments and its work items; drafts and pending uploads excluded.' }
        watcher_count: { type: integer }
        custom_fields:
          type: array
          items: { $ref: '#/components/schemas/IssueCustomFieldValue' }
          description: 'Every live custom field that applies to the issue''s type, in field order, empty ones included. A value kept from a type the field applied to is not listed.'
        me:
          type: object
          required: [starred, voted, watching]
          properties:
            starred: { type: boolean }
            voted: { type: boolean }
            watching: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time }
        restorable_until: { type: [string, 'null'], format: date-time, description: Set on a deleted issue; after it the nightly purge removes the issue. }
    IssueEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/Issue' }
    IssueActivity:
      type: object
      required: [id, kind, actor, change_group_id, field, old_value, new_value, people, created_at, updated_at, comment]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [created, field_changed, commented, comment_edited, comment_deleted, linked, unlinked, attached, detached, time_logged, tagged, untagged, sprint_changed, parent_changed, deleted, restored]
        actor:
          type: object
          required: [username, name, avatar_url, former_member, deactivated]
          properties:
            username: { type: [string, 'null'] }
            name: { type: string }
            avatar_url: { type: [string, 'null'] }
            former_member: { type: boolean }
            deactivated: { type: boolean, description: The account is deactivated; render the real name greyed. }
        change_group_id: { type: string, format: uuid }
        field: { type: [string, 'null'], example: status }
        old_value:
          description: Snapshot at write time; see the history endpoint. On `unlinked`, an `IssueLinkSnapshot`.
          anyOf: [{ $ref: '#/components/schemas/IssueLinkSnapshot' }, {}]
        new_value:
          description: Snapshot at write time. On `linked`, an `IssueLinkSnapshot`.
          anyOf: [{ $ref: '#/components/schemas/IssueLinkSnapshot' }, {}]
        people:
          type: array
          items: { $ref: '#/components/schemas/MemberRef' }
          description: 'Everyone the snapshots name by username — an `assignees` set, a `time_logged` author, the value of a `custom:<slug>` user or multi-user field — resolved now, former members included with `former_member: true`, so a removed person still renders by name.'
        created_at: { type: string, format: date-time, description: First touch; the ordering. }
        updated_at: { type: string, format: date-time, description: Last touch; the displayed time. }
        comment:
          description: On `commented` and `comment_edited`, the comment as it is now; `null` otherwise.
          oneOf:
            - $ref: '#/components/schemas/Comment'
            - { type: 'null' }
    IssueLinkSnapshot:
      description: What a `linked` / `unlinked` history entry carries on its side, read from this issue.
      type: object
      required: [link, issue]
      properties:
        link:
          type: string
          enum: [relates to, is required for, depends on, is duplicated by, duplicates, parent for, subtask of]
          example: depends on
          description: The link's name as read from this issue.
        issue:
          type: [string, 'null']
          example: PMS-3
          description: 'The other issue''s key; `null` when the caller cannot read its project. The entry is still listed and counted, so paging does not move.'
    TagRef:
      type: object
      required: [name, slug, color]
      properties:
        name: { type: string, example: Needs Review, description: As first typed. }
        slug: { type: string, example: needs-review, description: 'Unique per organisation; colons kept (`area:billing`).' }
        color: { $ref: '#/components/schemas/LabelColor' }
    TagInputs:
      type: array
      minItems: 1
      maxItems: 50
      description: 'Names or slugs; an object gives a tag the colour it takes if it is new.'
      example: ['needs-review', { name: 'area:billing', color: teal-3 }]
      items:
        oneOf:
          - { type: string, maxLength: 100 }
          - type: object
            required: [name]
            properties:
              name: { type: string, maxLength: 100 }
              color: { $ref: '#/components/schemas/LabelColor' }
    Tag:
      allOf:
        - $ref: '#/components/schemas/TagRef'
        - type: object
          required: [issue_count, article_count]
          properties:
            issue_count: { type: integer, description: Live issues the caller can read that carry it. }
            article_count: { type: integer, description: Articles the caller can open that carry it. }
    ArticleRef:
      type: object
      required: [slug, title]
      properties:
        slug: { type: string, example: restoring-a-failed-sync }
        title: { type: string }
    ArticleStatus: { type: string, enum: [draft, published] }
    Article:
      type: object
      required: [project, slug, title, status, body_md, parent, path, position, child_count, tags, created_by, updated_by, created_at, updated_at, published_at, comment_count, attachment_count, watcher_count, me, deleted_at, restorable_until]
      properties:
        project:
          type: object
          required: [key, name]
          properties:
            key: { type: string }
            name: { type: string }
        slug: { type: string, description: 'Unique per project among live articles, case-insensitively; set once and kept on rename.' }
        title: { type: string }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        body_md: { type: string, description: Markdown. }
        parent: { oneOf: [{ $ref: '#/components/schemas/ArticleRef' }, { type: 'null' }], description: The nearest ancestor the caller can read. }
        path: { type: array, items: { $ref: '#/components/schemas/ArticleRef' }, description: 'Readable ancestors, root first: the breadcrumb.' }
        position: { type: integer, description: 'Order among its siblings, from 0.' }
        child_count: { type: integer, description: Children the caller can read. }
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' } }
        created_by: { $ref: '#/components/schemas/MemberRef' }
        updated_by: { $ref: '#/components/schemas/MemberRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        published_at: { type: [string, 'null'], format: date-time, description: The latest publish; kept when it returns to draft. }
        comment_count: { type: integer }
        attachment_count: { type: integer }
        watcher_count: { type: integer }
        me:
          type: object
          required: [starred, watching, can_edit, can_publish, can_move, can_delete, can_comment]
          properties:
            starred: { type: boolean }
            watching: { type: boolean }
            can_edit: { type: boolean }
            can_publish: { type: boolean }
            can_move: { type: boolean }
            can_delete: { type: boolean }
            can_comment: { type: boolean }
        deleted_at: { type: [string, 'null'], format: date-time }
        restorable_until: { type: [string, 'null'], format: date-time }
    ArticleEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/Article' }
    ArticleNode:
      type: object
      required: [slug, title, status, parent, depth, position, child_count, starred, updated_at, deleted_at, restorable_until]
      properties:
        slug: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        parent: { type: [string, 'null'], description: The nearest readable ancestor's slug. }
        depth: { type: integer, minimum: 1, maximum: 3 }
        position: { type: integer }
        child_count: { type: integer }
        starred: { type: boolean }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time }
        restorable_until: { type: [string, 'null'], format: date-time }
    ArticleNodeListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/ArticleNode' } }
    ArticleSummary:
      type: object
      required: [project, slug, title, status, parent, tags, created_by, updated_by, created_at, updated_at, published_at, excerpt, starred]
      properties:
        project: { $ref: '#/components/schemas/Article/properties/project' }
        slug: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        parent: { oneOf: [{ $ref: '#/components/schemas/ArticleRef' }, { type: 'null' }] }
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' } }
        created_by: { $ref: '#/components/schemas/MemberRef' }
        updated_by: { $ref: '#/components/schemas/MemberRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        published_at: { type: [string, 'null'], format: date-time }
        excerpt: { type: string, description: 'Plain text: the passage matching the free text, else the start of the body.' }
        starred: { type: boolean }
    ArticleSummaryListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/ArticleSummary' } }
    CreateArticleRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        body_md: { type: string }
        slug: { type: string, maxLength: 80, description: Instead of one made from the title. }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        parent: { type: [string, 'null'], description: Slug or title. }
        before: { type: string, description: A sibling's slug or title. At most one of before and after. }
        after: { type: string }
        tags: { $ref: '#/components/schemas/TagInputs' }
        color: { $ref: '#/components/schemas/LabelColor' }
        attachment_ids: { $ref: '#/components/schemas/AttachmentIds' }
    UpdateArticleRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        body_md: { type: string }
        slug: { type: string, maxLength: 80 }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        parent: { type: [string, 'null'], description: 'Slug or title; `null` is the top level.' }
        before: { type: string }
        after: { type: string }
    ArticleComment:
      type: object
      required: [id, article, author, body_md, created_at, edited_at, deleted_at, me]
      properties:
        id: { type: integer }
        article:
          type: object
          required: [project, slug]
          properties:
            project: { type: string }
            slug: { type: string }
        author: { $ref: '#/components/schemas/MemberRef' }
        body_md: { type: string }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, 'null'], format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time }
        me: { $ref: '#/components/schemas/Comment/properties/me' }
    ArticleCommentEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/ArticleComment' }
    SearchGroupError:
      type: [object, 'null']
      description: Why this group's vocabulary could not read the query; the same fields as an error body.
      properties:
        code: { type: string }
        message: { type: string }
        field: { type: string }
        valid_values: { type: array, items: { type: string } }
        span: { type: object, properties: { start: { type: integer }, end: { type: integer } } }
    GlobalSearchEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              required: [issues, articles]
              properties:
                issues:
                  type: object
                  required: [items, total, error]
                  properties:
                    items:
                      type: array
                      items:
                        allOf:
                          - $ref: '#/components/schemas/IssueRef'
                          - { type: object, required: [project], properties: { project: { $ref: '#/components/schemas/Article/properties/project' } } }
                    total: { type: integer }
                    error: { $ref: '#/components/schemas/SearchGroupError' }
                articles:
                  type: object
                  required: [items, total, error]
                  properties:
                    items: { type: array, items: { $ref: '#/components/schemas/ArticleSummary' } }
                    total: { type: integer }
                    error: { $ref: '#/components/schemas/SearchGroupError' }
    IssueRef:
      type: object
      required: [key, title, resolved, status, type, starred]
      properties:
        key: { type: string, example: PMS-7 }
        title: { type: string }
        resolved: { type: boolean, description: In a done or cancelled status; render the key struck through. }
        status: { $ref: '#/components/schemas/Issue/properties/status' }
        type: { $ref: '#/components/schemas/Issue/properties/type' }
        starred: { type: boolean, description: By the caller. }
    IssueLinkName:
      type: string
      description: Case-insensitive.
      enum: [relates to, is required for, depends on, is duplicated by, duplicates, parent for, subtask of]
    IssueLinkGroup:
      type: object
      required: [link, type, direction, count, issues]
      properties:
        link: { $ref: '#/components/schemas/IssueLinkName' }
        type: { type: string, enum: [relates, depends, duplicate, subtask] }
        direction: { type: string, enum: [outward, inward] }
        count: { type: integer }
        issues: { type: array, items: { $ref: '#/components/schemas/IssueRef' } }
    IssueLinkGroupsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/IssueLinkGroup' } }
    Comment:
      type: object
      required: [id, issue, author, body_md, created_at, edited_at, deleted_at, me]
      properties:
        id: { type: integer }
        issue: { type: string, example: PMS-118 }
        author: { $ref: '#/components/schemas/MemberRef' }
        body_md: { type: string, description: Markdown. }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, 'null'], format: date-time, description: The edited marker. }
        deleted_at: { type: [string, 'null'], format: date-time, description: Set only on the DELETE response. }
        me:
          type: object
          required: [can_edit, can_delete]
          properties:
            can_edit: { type: boolean }
            can_delete: { type: boolean }
    CommentEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/Comment' }
    DurationInput:
      description: Integer minutes, or a duration such as `1h 30m` read with the organisation's workday and workweek.
      oneOf:
        - { type: integer, minimum: 1 }
        - { type: string, minLength: 1, maxLength: 40, example: 1d 2h }
    StorageUsage:
      type: object
      required: [used_bytes, limit_bytes, level, configured, bring_your_own]
      description: Private-bucket usage against the plan's quota. Every member sees it; the web shows the banners from `level`.
      properties:
        used_bytes: { type: integer, description: Completed files in the platform's private bucket; the organisation's own bucket never counts. }
        limit_bytes: { type: integer, description: 5 GB on free and pro_lite, 50 GB on pro, 250 GB on unlimited. }
        level: { type: string, enum: [ok, warning, critical, full], description: 'warning from 80%, critical from 95%, full at 100%. Always `ok` while the organisation''s own bucket is verified: nothing is limited then.' }
        configured: { type: boolean, description: 'false where the server has no private bucket (and the organisation has no verified bucket of its own): uploads would answer `storage.not_configured`, so the web hides them.' }
        bring_your_own: { type: [string, 'null'], enum: [pending, verified, failed, null], description: 'The organisation''s own bucket, when one is connected. `verified`: uploads go there. `pending`: being set up and not serving — including a first check that failed, which blocks nothing. `failed` only after it had verified: its key was refused, and its files and uploads answer `storage.byo_unavailable` until an admin fixes it.' }
    ByoCheckError:
      type: object
      required: [step, reason]
      properties:
        step: { type: string, enum: [connect, put, get, delete, browser] }
        reason: { type: string, enum: [invalid_key, wrong_secret, no_bucket, access_denied, wrong_region, unreachable, mismatch, unknown] }
    StorageMigration:
      type: object
      required: [state, migrated_bytes, total_bytes, migrated_files, total_files, error, started_at, finished_at, stalled]
      properties:
        state: { type: string, enum: [idle, running, done, failed] }
        migrated_bytes: { type: integer }
        total_bytes: { type: integer }
        migrated_files: { type: integer }
        total_files: { type: integer }
        error: { oneOf: [{ $ref: '#/components/schemas/ByoCheckError' }, { type: 'null' }] }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        stalled: { type: boolean, description: Running with no progress for 30 minutes; offer a retry. }
    StorageConnection:
      type: object
      required: [provider, endpoint, region, bucket, access_key_id, secret, status, verified_at, checked_at, last_error, migration, created_by, updated_by, created_at, updated_at]
      properties:
        provider: { type: string, enum: [r2, s3] }
        endpoint: { type: string, example: 'https://s3.eu-west-1.amazonaws.com' }
        region: { type: string, example: eu-west-1 }
        bucket: { type: string }
        access_key_id: { type: string }
        secret: { type: string, example: '••••••••', description: Always this fixed mask. The secret is never returned. }
        status: { type: string, enum: [pending, verified, failed] }
        verified_at: { type: [string, 'null'], format: date-time }
        checked_at: { type: [string, 'null'], format: date-time }
        last_error: { oneOf: [{ $ref: '#/components/schemas/ByoCheckError' }, { type: 'null' }] }
        migration: { $ref: '#/components/schemas/StorageMigration' }
        created_by: { $ref: '#/components/schemas/MemberRef' }
        updated_by: { $ref: '#/components/schemas/MemberRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StorageConnectionEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/StorageConnection' }
    StorageTally:
      type: object
      required: [files, bytes]
      properties:
        files: { type: integer }
        bytes: { type: integer }
    StorageOverview:
      type: object
      required: [platform, bring_your_own, unclaimed, awaiting_purge, earlier_buckets, connection, cors_origin]
      properties:
        platform:
          allOf:
            - $ref: '#/components/schemas/StorageTally'
            - type: object
              required: [limit_bytes, level]
              properties:
                limit_bytes: { type: integer }
                level: { type: string, enum: [ok, warning, critical, full] }
        bring_your_own: { $ref: '#/components/schemas/StorageTally' }
        unclaimed: { $ref: '#/components/schemas/StorageTally' }
        awaiting_purge: { $ref: '#/components/schemas/StorageTally' }
        earlier_buckets:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/StorageTally'
              - { type: object, required: [bucket], properties: { bucket: { type: string } } }
        connection: { oneOf: [{ $ref: '#/components/schemas/StorageConnection' }, { type: 'null' }] }
        cors_origin: { type: string, format: uri }
    StorageOverviewEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/StorageOverview' }
    StorageFile:
      type: object
      required: [id, filename, mime_type, size_bytes, url, storage_target, available, project, issue, article, comment_id, work_item_id, purges_at, created_by, created_at, me]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        url: { type: string, format: uri }
        storage_target: { type: string, enum: [platform, byo] }
        available: { type: boolean }
        project: { type: string, example: PMS }
        issue: { type: [string, 'null'], example: PMS-118 }
        article:
          type: [object, 'null']
          properties:
            slug: { type: string }
            title: { type: string }
        comment_id: { type: [integer, 'null'] }
        work_item_id: { type: [integer, 'null'] }
        purges_at: { type: [string, 'null'], format: date-time, description: Set while the issue or article is deleted but restorable. }
        created_by: { $ref: '#/components/schemas/MemberRef' }
        created_at: { type: string, format: date-time }
        me:
          type: object
          required: [can_delete]
          properties:
            can_delete: { type: boolean }
    StorageFileListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/StorageFile' } }
    ConnectStorageRequest:
      allOf:
        - $ref: '#/components/schemas/StepUp'
        - type: object
          required: [provider, bucket, access_key_id, secret_access_key]
          properties:
            provider: { type: string, enum: [r2, s3] }
            account_id: { type: string, pattern: '^[a-f0-9]{32}$', description: R2 only. }
            jurisdiction: { type: string, enum: [default, eu, fedramp], description: R2 only. }
            region: { type: string, example: eu-west-1, description: S3 only. }
            endpoint: { type: string, format: uri, description: Refused unless the server allows any endpoint (never in production). }
            bucket: { type: string }
            access_key_id: { type: string }
            secret_access_key: { type: string, writeOnly: true }
    StorageBrowserCheckRequest:
      type: object
      required: [size, sha256]
      properties:
        size: { type: integer, enum: [8192] }
        sha256: { type: string, description: SHA-256 of the test file, base64. }
    StorageBrowserCheck:
      type: object
      required: [check_id, upload_url, upload_headers, download_url, expires_in]
      properties:
        check_id: { type: string, format: uuid }
        upload_url: { type: string, format: uri }
        upload_headers: { type: object, additionalProperties: { type: string } }
        download_url: { type: string, format: uri }
        expires_in: { type: integer }
    StorageBrowserCheckEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/StorageBrowserCheck' }
    VerifyStorageRequest:
      type: object
      required: [check_id, sha256]
      properties:
        check_id: { type: string, format: uuid }
        sha256: { type: string }
    Attachment:
      type: object
      required: [id, filename, mime_type, size_bytes, url, width, height, issue, article, comment_id, work_item_id, status, available, inline, created_by, created_at, deleted_at, me]
      properties:
        id: { type: string, format: uuid, description: 'Random (v4); the only identifier in a file URL.' }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        url: { type: string, format: uri, example: 'https://files.nothingleft.dev/6f1c…/login-bug.png', description: The permanent URL to store in markdown. Never a presigned one. }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        issue: { type: [string, 'null'], example: PMS-118, description: '`null` while a draft, and on an article''s file.' }
        article:
          type: [object, 'null']
          description: Set instead of `issue` on a file in a knowledge base article or a comment on one.
          properties:
            project: { type: string }
            slug: { type: string }
        comment_id: { type: [integer, 'null'] }
        work_item_id: { type: [integer, 'null'] }
        status: { type: string, enum: [pending, ready], description: '`pending` until `complete`; only the uploader sees a pending attachment.' }
        available: { type: boolean, description: 'false when the file is in the organisation''s own bucket and that bucket is disconnected or failing: its URL answers an error, so draw a placeholder.' }
        inline: { type: boolean, description: 'The issue description (or article body) or a live comment links to it.' }
        created_by: { $ref: '#/components/schemas/MemberRef' }
        created_at: { type: string, format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time, description: Set only on the delete response. }
        me:
          type: object
          required: [can_delete]
          properties:
            can_delete: { type: boolean }
    AttachmentEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/Attachment' }
    AttachmentListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
    PresignAttachmentRequest:
      type: object
      required: [filename, mime, size, sha256]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        mime: { type: string, example: image/png }
        size: { type: integer, minimum: 1, description: Exact length in bytes; at most 100 MB. }
        sha256: { type: string, description: 'SHA-256 of the file, base64 (44 characters).' }
        issue: { type: string, example: PMS-118 }
        comment_id: { type: integer }
        work_item_id: { type: integer }
        project: { type: string, example: PMS, description: 'A draft for a form whose parent does not exist yet, instead of `issue`; with `article`, that project''s article.' }
        article: { type: string, example: restoring-a-failed-sync, description: 'An article of `project`, by slug; with `comment_id`, a comment on it.' }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    AttachmentPresignEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              required: [attachment, upload_url, upload_headers, expires_in]
              properties:
                attachment: { $ref: '#/components/schemas/Attachment' }
                upload_url: { type: string, format: uri }
                upload_headers:
                  type: object
                  additionalProperties: { type: string }
                  description: 'Send every one on the `PUT`, unchanged: `Content-Type` and `x-amz-checksum-sha256`.'
                expires_in: { type: integer, example: 900 }
    AttachmentIds:
      type: array
      maxItems: 50
      items: { type: string, format: uuid }
      description: 'Your own finished drafts (`POST /v1/attachments/presign` with `project`), claimed by the resource this request creates, with an `attached` history entry each in the same change group.'
    AttachmentSnapshot:
      description: What an `attached` (`new_value`) or `detached` (`old_value`) history entry carries, read at write time.
      type: object
      required: [attachment_id, filename, mime_type, size_bytes, comment_id, work_item_id]
      properties:
        attachment_id: { type: string, format: uuid }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        comment_id: { type: [integer, 'null'] }
        work_item_id: { type: [integer, 'null'] }
    WorkItem:
      type: object
      required: [id, issue, author, created_by, work_date, duration_minutes, work_type, attributes, description_md, created_at, updated_at, me]
      properties:
        id: { type: integer }
        issue: { type: string, example: PMS-118, description: 'The issue the time is on — a subtask when listed with `include=subtasks`.' }
        author: { $ref: '#/components/schemas/MemberRef' }
        created_by: { $ref: '#/components/schemas/MemberRef', description: Who recorded it; a Project Admin when logged on the author's behalf. }
        work_date: { type: string, format: date, description: 'A calendar date, never timezone-shifted.' }
        duration_minutes: { type: integer, minimum: 1 }
        work_type:
          oneOf:
            - type: object
              required: [name, short_label]
              properties:
                name: { type: string }
                short_label: { type: string }
            - type: 'null'
        attributes:
          type: array
          description: "The project's own work item attributes that are set, in attribute order. Work type is `work_type`."
          items:
            type: object
            required: [attribute, value]
            properties:
              attribute: { type: string, example: Billable }
              value:
                type: object
                required: [name, short_label]
                properties:
                  name: { type: string, example: 'Yes' }
                  short_label: { type: string, example: 'Y' }
        description_md: { type: string, description: Markdown; empty when no note was written. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        me:
          type: object
          required: [can_edit, can_delete]
          properties:
            can_edit: { type: boolean }
            can_delete: { type: boolean }
    WorkItemEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/WorkItem' }
    WorkItemListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/WorkItem' } }
    WorkItemSnapshot:
      description: What a `time_logged` history entry carries on each side, read at write time.
      type: object
      required: [work_item_id, author, work_date, minutes, work_type]
      properties:
        work_item_id: { type: integer }
        author: { type: string, description: The author's username. }
        work_date: { type: string, format: date }
        minutes: { type: integer }
        work_type: { type: [string, 'null'] }
        attributes: { type: object, additionalProperties: { type: string }, description: 'Attribute name → value name, only those set; absent when none.' }
    ToggleTask:
      type: object
      required: [index, checked]
      properties:
        index: { type: integer, minimum: 0, description: 'The task checkbox, counted from 0 in document order.' }
        checked: { type: boolean }
    IssueWatcher:
      allOf:
        - $ref: '#/components/schemas/MemberRef'
        - type: object
          required: [source]
          properties:
            source: { type: string, enum: [explicit, auto] }
    IssueWatcherEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/IssueWatcher' }
    ProjectEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/Project' }
    ProjectMember:
      allOf:
        - $ref: '#/components/schemas/MemberRef'
        - type: object
          required: [role, org_role, added_at]
          properties:
            role: { $ref: '#/components/schemas/ProjectRole' }
            org_role: { $ref: '#/components/schemas/OrgRole' }
            added_at: { type: string, format: date-time }
    ProjectMemberEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/ProjectMember' }
    Invitation:
      type: object
      required: [id, kind, status, email, url, project_key, org_role, project_role, max_uses, use_count, expires_at, allowed_email_domain, created_by, created_at, revoked_at]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [email, link] }
        status: { type: string, enum: [active, accepted, expired, exhausted, revoked] }
        email: { type: [string, 'null'] }
        url: { type: [string, 'null'], description: 'Share links only: `APP_BASE_URL/invite/<token>`.' }
        project_key: { type: [string, 'null'] }
        org_role: { $ref: '#/components/schemas/OrgRole' }
        project_role:
          oneOf:
            - $ref: '#/components/schemas/ProjectRole'
            - type: 'null'
        max_uses: { type: [integer, 'null'] }
        use_count: { type: integer }
        expires_at: { type: [string, 'null'], format: date-time }
        allowed_email_domain: { type: [string, 'null'] }
        created_by: { $ref: '#/components/schemas/MemberRef' }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    InvitationEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/Invitation' }
    InvitationListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
    InvitationUse:
      allOf:
        - $ref: '#/components/schemas/MemberRef'
        - type: object
          required: [used_at]
          properties:
            used_at: { type: string, format: date-time }
    InvitationPreview:
      type: object
      required: [kind, organization, project, invited_by, org_role, project_role, email, allowed_email_domain, expires_at, already_member]
      properties:
        kind: { type: string, enum: [email, link] }
        organization:
          type: object
          required: [slug, name, avatar_url]
          properties:
            slug: { type: string }
            name: { type: string }
            avatar_url: { type: string }
        project:
          type: [object, 'null']
          required: [key, name]
          properties:
            key: { type: string }
            name: { type: string }
        invited_by:
          type: object
          required: [name, avatar_url]
          properties:
            name: { type: string }
            avatar_url: { type: [string, 'null'] }
        org_role: { $ref: '#/components/schemas/OrgRole' }
        project_role:
          oneOf:
            - $ref: '#/components/schemas/ProjectRole'
            - type: 'null'
        email: { type: [string, 'null'], description: 'The addressee of an email invitation, to prefill sign-up.' }
        allowed_email_domain: { type: [string, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
        already_member: { type: [boolean, 'null'] }
    OrgActivity:
      type: object
      required: [id, kind, actor, target_type, target_id, old_value, new_value, ip, created_at]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [member_invited, member_joined, member_removed, role_changed, invite_created, invite_revoked, project_created, project_archived, project_deleted, schema_changed, custom_field_changed, storage_connected, storage_disconnected, ownership_transferred, org_settings_changed, export_requested, token_created, token_revoked, project_updated, project_unarchived, invite_rotated, username_changed, deletion_scheduled, deletion_cancelled, storage_updated]
        actor:
          type: [object, 'null']
          required: [username, name, avatar_url, former_member, deactivated]
          properties:
            username: { type: [string, 'null'], description: 'Null when the actor never belonged to the organisation, such as an invitee declining.' }
            name: { type: string }
            avatar_url: { type: [string, 'null'] }
            former_member: { type: boolean }
            deactivated: { type: boolean, description: The account is deactivated; render the real name greyed. }
        target_type: { type: string, enum: [organization, member, project_member, project, invitation] }
        target_id: { type: string, description: 'Internal id as text; `<project id>:<user id>` for `project_member`. Names ride in the values.' }
        old_value: {}
        new_value: {}
        ip: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    SprintState: { type: string, enum: [planned, active, completed] }
    SprintRef:
      type: object
      required: [name, slug, state]
      properties:
        name: { type: string, example: September 2026 }
        slug: { type: string, example: september-2026 }
        state: { $ref: '#/components/schemas/SprintState' }
    SubtaskProgress:
      type: object
      required: [resolved, total]
      description: Live direct subtasks — the `1/3` on a board card.
      properties:
        resolved: { type: integer }
        total: { type: integer }
    StatusCount:
      type: object
      required: [name, category, color, count]
      properties:
        name: { type: string }
        category: { $ref: '#/components/schemas/StatusCategory' }
        color: { $ref: '#/components/schemas/LabelColor' }
        count: { type: integer }
    Sprint:
      allOf:
        - $ref: '#/components/schemas/SprintRef'
        - type: object
          required: [project, goal_md, start_date, end_date, started_at, completed_at, days_left, progress, snapshots, created_by, created_at, updated_at]
          properties:
            project:
              type: object
              required: [key, name]
              properties:
                key: { type: string }
                name: { type: string }
            goal_md: { type: [string, 'null'], description: Markdown. }
            start_date: { type: [string, 'null'], format: date, description: '`null`: Unscheduled.' }
            end_date: { type: [string, 'null'], format: date }
            started_at: { type: [string, 'null'], format: date-time }
            completed_at: { type: [string, 'null'], format: date-time }
            days_left: { type: [integer, 'null'], description: "Active sprints only: calendar days from the caller's today to the end date, never below 0." }
            progress:
              type: object
              required: [issues, resolved_issues, points, resolved_points, remaining_estimate_minutes, by_status, mine]
              properties:
                issues: { type: integer }
                resolved_issues: { type: integer }
                points: { type: integer }
                resolved_points: { type: integer }
                remaining_estimate_minutes: { type: integer }
                by_status: { type: array, items: { $ref: '#/components/schemas/StatusCount' } }
                mine:
                  type: object
                  required: [issues, resolved_issues]
                  properties:
                    issues: { type: integer }
                    resolved_issues: { type: integer }
            snapshots:
              type: [array, 'null']
              description: The daily burndown series on the single-sprint read; `null` in lists.
              items:
                type: object
                required: [date, total_points, completed_points, total_issues, completed_issues, remaining_estimate_minutes]
                properties:
                  date: { type: string, format: date }
                  total_points: { type: integer }
                  completed_points: { type: integer }
                  total_issues: { type: integer }
                  completed_issues: { type: integer }
                  remaining_estimate_minutes: { type: integer }
            created_by: { $ref: '#/components/schemas/MemberRef' }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    SprintEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/Sprint' }
    SprintListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { type: array, items: { $ref: '#/components/schemas/Sprint' } }
    SprintFinishResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              required: [sprint, moved, moved_to]
              properties:
                sprint: { $ref: '#/components/schemas/Sprint' }
                moved: { type: array, items: { type: string }, description: The issue keys carried over. }
                moved_to:
                  oneOf:
                    - { $ref: '#/components/schemas/SprintRef' }
                    - { type: 'null' }
                  description: '`null`: the backlog.'
    BoardSwimlane: { type: string, enum: [none, values, issues] }
    BoardColumnField: { type: string, enum: [status, priority, type], description: 'What the columns map; moving a card sets this field of the issue.' }
    BoardValueRef:
      type: object
      required: [name, color, short_label, category]
      properties:
        name: { type: string }
        color: { $ref: '#/components/schemas/LabelColor' }
        short_label: { type: string }
        category: { oneOf: [{ $ref: '#/components/schemas/StatusCategory' }, { type: 'null' }], description: 'Statuses only.' }
    BoardValueCount:
      type: object
      required: [name, color, category, count]
      properties:
        name: { type: string }
        color: { $ref: '#/components/schemas/LabelColor' }
        category: { oneOf: [{ $ref: '#/components/schemas/StatusCategory' }, { type: 'null' }] }
        count: { type: integer }
    StatusRef:
      type: object
      required: [name, category, color, short_label]
      properties:
        name: { type: string }
        category: { $ref: '#/components/schemas/StatusCategory' }
        color: { $ref: '#/components/schemas/LabelColor' }
        short_label: { type: string }
    BoardColumn:
      type: object
      required: [name, values, wip_min, wip_max, collapsed_by_default, resolved]
      properties:
        name: { type: string }
        values: { type: array, items: { $ref: '#/components/schemas/BoardValueRef' }, description: "Values of the board's column_field, in the project's order." }
        wip_min: { type: [integer, 'null'] }
        wip_max: { type: [integer, 'null'] }
        collapsed_by_default: { type: boolean }
        resolved: { type: boolean, description: 'A status column whose every status is done or cancelled: the *resolved* badge. Always false on priority and type boards.' }
    BoardColumnInput:
      type: object
      required: [name, values]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        values: { type: array, minItems: 1, maxItems: 50, items: { type: string }, description: "Names of the column_field's values, case-insensitive." }
        wip_min: { type: [integer, 'null'], minimum: 1, maximum: 999 }
        wip_max: { type: [integer, 'null'], minimum: 1, maximum: 999 }
        collapsed_by_default: { type: boolean }
    BoardInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        column_field: { $ref: '#/components/schemas/BoardColumnField' }
        columns: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/BoardColumnInput' } }
        swimlane_by: { $ref: '#/components/schemas/BoardSwimlane' }
        swimlane_field: { type: [string, 'null'], enum: [assignee, priority, type, null] }
        swimlane_types: { type: array, maxItems: 20, items: { type: string }, description: Type names whose issues become lanes. }
    Board:
      type: object
      required: [name, slug, project, column_field, columns, unmapped_values, swimlane_by, swimlane_field, swimlane_types, created_by, created_at, updated_at]
      properties:
        name: { type: string }
        slug: { type: string, description: Unique in the organisation. }
        project:
          type: object
          required: [key, name]
          properties:
            key: { type: string }
            name: { type: string }
        column_field: { $ref: '#/components/schemas/BoardColumnField' }
        columns: { type: array, items: { $ref: '#/components/schemas/BoardColumn' } }
        unmapped_values: { type: array, items: { $ref: '#/components/schemas/BoardValueRef' }, description: 'Values of column_field on no column: what *Add column* offers.' }
        swimlane_by: { $ref: '#/components/schemas/BoardSwimlane' }
        swimlane_field: { type: [string, 'null'], enum: [assignee, priority, type, null] }
        swimlane_types: { type: array, items: { type: string } }
        created_by: { $ref: '#/components/schemas/MemberRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BoardEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/Board' }
    BoardCard:
      type: object
      required: [key, title, status, priority, type, assignees, tags, due_date, story_points, estimate_minutes, parent, subtasks, resolved]
      properties:
        key: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/StatusRef' }
        priority: { type: object }
        type: { type: object }
        assignees: { type: array, items: { $ref: '#/components/schemas/MemberRef' } }
        tags: { type: array, items: { $ref: '#/components/schemas/TagRef' } }
        due_date: { type: [string, 'null'], format: date }
        story_points: { type: [integer, 'null'] }
        estimate_minutes: { type: [integer, 'null'] }
        parent: { type: [string, 'null'] }
        subtasks: { $ref: '#/components/schemas/SubtaskProgress' }
        resolved: { type: boolean }
    BoardViewEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              required: [board, sprint, columns, lanes, distribution, unmapped, truncated]
              properties:
                board: { $ref: '#/components/schemas/Board' }
                sprint:
                  oneOf:
                    - { $ref: '#/components/schemas/Sprint' }
                    - { type: 'null' }
                columns:
                  type: array
                  items:
                    allOf:
                      - $ref: '#/components/schemas/BoardColumn'
                      - type: object
                        required: [count, total, over_wip_max, under_wip_min]
                        properties:
                          count: { type: integer, description: Cards matching the filter. }
                          total: { type: integer, description: Every card of the sprint in the column. }
                          over_wip_max: { type: boolean }
                          under_wip_min: { type: boolean }
                lanes:
                  type: array
                  items:
                    type: object
                    required: [kind, key, label, issue, member, count, cells]
                    properties:
                      kind: { type: string, enum: [all, value, issue, uncategorized] }
                      key: { type: [string, 'null'], description: "The value's name (a username for assignees) or the lane issue's key." }
                      label: { type: string }
                      issue: { oneOf: [{ $ref: '#/components/schemas/BoardCard' }, { type: 'null' }], description: 'The lane issue, heading its lane.' }
                      member: { oneOf: [{ $ref: '#/components/schemas/MemberRef' }, { type: 'null' }] }
                      count: { type: integer }
                      cells:
                        type: array
                        items:
                          type: object
                          required: [column, cards]
                          properties:
                            column: { type: string }
                            cards: { type: array, items: { $ref: '#/components/schemas/BoardCard' } }
                distribution: { type: array, items: { $ref: '#/components/schemas/StatusCount' }, description: The status distribution strip over the filtered cards. }
                unmapped: { type: array, items: { $ref: '#/components/schemas/BoardValueCount' }, description: "Filtered cards per value of the column field that sits on no column." }
                truncated: { type: boolean }
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
          description: UUID v7, or the inbound X-Request-Id if one was sent. Also returned as the X-Request-Id header.
        pagination:
          $ref: '#/components/schemas/Pagination'
        groups:
          type: array
          description: Only on a grouped issue list.
          items: { $ref: '#/components/schemas/IssueGroup' }
    IssueGroup:
      type: object
      required: [value, label, count, color]
      properties:
        value: { type: [string, 'null'], description: 'The group value (status name, username, project key, due bucket…); `null` is the empty group.' }
        label: { type: string, description: 'What a header shows, e.g. `Unassigned` or the member''s name.' }
        count: { type: integer }
        color: { type: [string, 'null'] }
        category:
          type: string
          enum: [backlog, unstarted, started, done, cancelled]
          description: 'Only with `group_by=status`: the status category, so resolved groups can start collapsed and the dot takes its texture.'
    Pagination:
      type: object
      required: [total, limit, offset, next_cursor, has_more]
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable machine-readable code. Maps to the catalogue key `error.<code>` in packages/i18n/en.json.
            message: { type: string }
            field: { type: string }
            valid_values:
              type: array
              items: { type: string }
            span:
              type: object
              description: A search query error only — the characters of the query at fault.
              properties:
                start: { type: integer }
                end: { type: integer }
            scope:
              type: string
              description: '`token.scope_missing` only — the scope the request needs, e.g. `issues:write`.'
            request_id: { type: string }
    Landing:
      type: object
      required: [kind, organization_slug, project_key]
      properties:
        kind: { type: string, enum: [project, project_list, org_switcher, no_org] }
        organization_slug: { type: [string, 'null'] }
        project_key: { type: [string, 'null'] }
    Suggestion:
      type: object
      required: [kind, label, insert, replace, description]
      properties:
        kind: { type: string, enum: [attribute, value, operator, saved_search, recent_search] }
        label: { type: string, example: 'created by:' }
        insert: { type: string, example: 'created by: ' }
        replace:
          type: object
          properties:
            start: { type: integer }
            end: { type: integer }
        description: { type: [string, 'null'], example: by reporter }
    SavedView:
      type: object
      required: [name, query, visibility, project, owner, sort, columns, position, can_edit, created_at, updated_at]
      properties:
        name: { type: string }
        query: { type: string, description: Canonical query text. }
        visibility: { type: string, enum: [private, project, org] }
        project:
          type: [object, 'null']
          properties:
            key: { type: string }
            name: { type: string }
        owner: { $ref: '#/components/schemas/MemberRef' }
        sort:
          type: array
          items:
            type: object
            properties:
              attribute: { type: string }
              direction: { type: string, enum: [asc, desc] }
        columns: { type: array, items: { type: string } }
        position: { type: integer }
        can_edit: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SavedViewEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/SavedView' }
    BulkUpdateResult:
      type: object
      required: [key, result]
      properties:
        key: { type: string }
        result: { type: string, enum: [updated, unchanged, failed] }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
            valid_values: { type: array, items: { type: string } }
    IssueFigures:
      type: object
      properties:
        project:
          type: [object, 'null']
          properties:
            key: { type: string }
            name: { type: string }
        open: { type: integer }
        unassigned: { type: integer, description: Open and unassigned. }
        overdue: { type: integer, description: Open with a due date before today. }
        due_today: { type: integer }
        created_7d: { type: integer }
        resolved_7d: { type: integer }
        resolved_prev_7d: { type: integer, description: 'The 7 days before that, for a trend.' }
        by_category:
          type: object
          properties:
            backlog: { type: integer }
            unstarted: { type: integer }
            started: { type: integer }
            done: { type: integer }
            cancelled: { type: integer }
        by_assignee:
          type: array
          description: Open issues per assignee, busiest first, at most 20.
          items:
            type: object
            properties:
              member: { $ref: '#/components/schemas/MemberRef' }
              open: { type: integer }
        logged_minutes_this_week: { type: integer }
        last_updated_at: { type: [string, 'null'], format: date-time }
    Me:
      type: object
      required: [id, email, name, avatar_url, timezone, email_verified_at, has_password, linked_providers, preferences, current_organization_slug, token, two_factor]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        avatar_url:
          type: [string, 'null']
          description: The uploaded object's public URL when one exists, otherwise the resolved chain value.
        timezone: { type: string, example: Asia/Kolkata }
        email_verified_at:
          type: [string, 'null']
          format: date-time
          description: Null until the address is proven — by the verification link, or by a Google/GitHub sign-in.
        has_password:
          type: boolean
          description: False for an account that has only ever signed in with a provider; it has no password to change.
        linked_providers:
          type: array
          items: { type: string, enum: [google, github] }
        preferences:
          type: object
          required: [theme, last_project_key, ui]
          properties:
            theme: { type: string, enum: [light, dark, system] }
            last_project_key:
              type: [string, 'null']
              description: The project key, not the id — a client routes on /projects/<key>.
            ui: { type: object, additionalProperties: true }
        current_organization_slug:
          type: [string, 'null']
          description: |
            The session's current organisation. A new session (sign-in, OAuth callback)
            starts in the sole membership, else the one most recently worked in, else the
            oldest; creating or joining an organisation and `POST /v1/me/current-organization`
            move it. Null for a PAT, an account with no memberships, and a session whose
            membership has since been removed.
        token:
          description: |
            The personal access token making this request, so an agent learns its scopes and
            project restriction before it tries a write. Null for a browser session.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CurrentToken'
        two_factor: { $ref: '#/components/schemas/TwoFactorStatus' }
    CurrentToken:
      type: object
      required: [name, token_prefix, scopes, project_keys, expires_at]
      properties:
        name: { type: string }
        token_prefix: { type: string, example: nl_pat_a1b2c3d4 }
        scopes:
          type: array
          items:
            type: string
            enum: [issues:read, issues:write, comments:write, time:write, admin:project, admin:org]
        project_keys:
          type: [array, 'null']
          description: Null means every project the owner can reach. An empty list means every project the token was restricted to has been deleted, and it reaches none.
          items: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
    MeEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/Me' }
    OAuthSignInEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              required: [me, notice]
              properties:
                me: { $ref: '#/components/schemas/Me' }
                notice:
                  description: Non-null only when this sign-in linked to an account whose address was never confirmed, removing its password. Shown to the user once.
                  oneOf:
                    - type: 'null'
                    - type: object
                      required: [kind, account_created_at]
                      properties:
                        kind: { type: string, enum: [unverified_account_linked] }
                        account_created_at: { type: string, format: date-time }
    Session:
      type: object
      required:
        [id, current, user_agent, ip, country_code, current_organization_slug, created_at, last_seen_at, expires_at]
      properties:
        id: { type: integer }
        current: { type: boolean, description: True for the session that made this request. }
        user_agent: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        country_code: { type: [string, 'null'], example: IN }
        current_organization_slug: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: Rolls 30 days forward whenever the session is used. }
    SessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data: { $ref: '#/components/schemas/Session' }
    PersonalAccessToken:
      type: object
      required:
        [id, name, token_prefix, scopes, project_keys, expires_at, last_used_at, created_at, revoked_at]
      properties:
        id: { type: integer }
        name: { type: string }
        token_prefix: { type: string, example: nl_pat_a1b2c3d4 }
        scopes:
          type: array
          items:
            type: string
            enum: [issues:read, issues:write, comments:write, time:write, admin:project, admin:org]
        project_keys:
          type: [array, 'null']
          description: Null means every project the owner can reach. An empty list means every project the token was restricted to has been deleted, and it reaches none. Keys, not ids.
          items: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    DeepHealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              required: [status, checks]
              properties:
                status: { type: string, enum: [ok, degraded] }
                checks:
                  type: object
                  required: [db, redis, storage]
                  properties:
                    db: { type: string, enum: [ok, fail] }
                    redis: { type: string, enum: [ok, fail] }
                    storage: { type: string, enum: [ok, fail, not_configured] }

    ReportScope:
      type: object
      required: [query, view, projects, period]
      properties:
        query: { type: [string, 'null'], description: 'The query as written, canonical; `#{views}` stay named.' }
        view: { type: [string, 'null'] }
        projects:
          type: array
          items: { type: object, required: [key, name], properties: { key: { type: string }, name: { type: string } } }
        period:
          type: [object, 'null']
          required: [from, to]
          properties: { from: { type: string, format: date }, to: { type: string, format: date } }
    ReportFilter:
      type: object
      required: [kind, label, widen_query]
      properties:
        kind: { type: string, enum: [clause, view, projects, period, users, unresolved_only, include_unassigned] }
        label: { type: string, example: 'priority: Critical' }
        widen_query: { type: [string, 'null'], description: 'The query without this filter; null when the filter is a parameter to drop.' }
    ReportEmpty:
      type: [object, 'null']
      required: [reason, message, filters]
      properties:
        reason: { type: string, enum: [no_issues, no_time, no_snapshots, no_dates] }
        message: { type: string, example: 'No issues match priority: Critical, in ACME.', description: 'Shown verbatim; never names a request parameter.' }
        filters: { type: array, items: { $ref: '#/components/schemas/ReportFilter' } }
    ReportGroup:
      type: object
      required: [value, label, color, category, series, count, share, query, other]
      properties:
        value: { type: [string, 'null'], description: 'The name to search by; null for the empty group and Other.' }
        label: { type: string }
        color: { oneOf: [{ $ref: '#/components/schemas/LabelColor' }, { type: 'null' }] }
        category: { type: [string, 'null'], enum: [backlog, unstarted, started, done, cancelled, null] }
        series: { type: [integer, 'null'], minimum: 1, maximum: 8, description: 'The chart series `--chart-N`; null folds into Other. The eight largest get one, numbered in the field''s own order.' }
        count: { type: integer }
        share: { type: number, description: 'Percent of the counted total, one decimal.' }
        query: { type: [string, 'null'], description: 'The issue-list query for this group; null for Other.' }
        other: { type: boolean }
    ReportPalette: { type: string, enum: [series, label, category], description: 'Series slots, the entities'' own label colours (status), or status categories.' }
    ReportCalendar:
      type: object
      required: [workday_minutes, workweek_days]
      properties: { workday_minutes: { type: integer }, workweek_days: { type: integer } }
    DistributionReport:
      type: object
      required: [report, scope, empty, generated_at, field, palette, groups, other, total_issues, total_counted, multi_valued_issues, by_category, by_category_available, truncated]
      properties:
        report: { type: string, enum: [issues-per-assignee, issues-per-project, issues-per-field] }
        scope: { $ref: '#/components/schemas/ReportScope' }
        empty: { $ref: '#/components/schemas/ReportEmpty' }
        generated_at: { type: string, format: date-time }
        field: { type: string }
        palette: { $ref: '#/components/schemas/ReportPalette' }
        groups: { type: array, items: { $ref: '#/components/schemas/ReportGroup' }, description: 'In the field''s own order, the empty group last; at most 500.' }
        other: { type: [object, 'null'], properties: { count: { type: integer }, groups: { type: integer } } }
        total_issues: { type: integer }
        total_counted: { type: integer }
        multi_valued_issues: { type: integer }
        by_category: { type: boolean }
        by_category_available: { type: boolean }
        truncated: { type: boolean }
    MatrixReport:
      type: object
      required: [report, scope, empty, generated_at, rows, columns, cells, max_cell, total_issues, multi_valued]
      properties:
        report: { type: string, enum: [matrix] }
        scope: { $ref: '#/components/schemas/ReportScope' }
        empty: { $ref: '#/components/schemas/ReportEmpty' }
        generated_at: { type: string, format: date-time }
        rows: { $ref: '#/components/schemas/MatrixAxis' }
        columns: { $ref: '#/components/schemas/MatrixAxis' }
        cells:
          type: array
          items:
            type: object
            required: [row, column, count, query]
            properties:
              row: { type: integer }
              column: { type: integer }
              count: { type: integer }
              query: { type: [string, 'null'] }
        max_cell: { type: integer }
        total_issues: { type: integer }
        multi_valued: { type: boolean }
    MatrixAxis:
      type: object
      required: [field, palette, groups, truncated]
      properties:
        field: { type: string }
        palette: { $ref: '#/components/schemas/ReportPalette' }
        groups: { type: array, items: { $ref: '#/components/schemas/ReportGroup' } }
        truncated: { type: boolean }
    BurndownReport:
      type: object
      required: [report, scope, empty, generated_at, sprint, measure, unit, days, summary, calendar]
      properties:
        report: { type: string, enum: [burndown] }
        scope: { $ref: '#/components/schemas/ReportScope' }
        empty: { $ref: '#/components/schemas/ReportEmpty' }
        generated_at: { type: string, format: date-time }
        sprint:
          type: object
          properties:
            project: { type: object, properties: { key: { type: string }, name: { type: string } } }
            name: { type: string }
            slug: { type: string }
            state: { type: string, enum: [planned, active, completed] }
            start_date: { type: [string, 'null'], format: date }
            end_date: { type: [string, 'null'], format: date }
            started_at: { type: [string, 'null'], format: date-time }
            completed_at: { type: [string, 'null'], format: date-time }
        measure: { type: string, enum: [story_points, issue_count, remaining_estimate] }
        unit: { type: string, enum: [points, issues, minutes] }
        days:
          type: array
          items:
            type: object
            required: [date, working_day, remaining, ideal, scope, scope_added, completed, live]
            properties:
              date: { type: string, format: date }
              working_day: { type: boolean }
              remaining: { type: [number, 'null'] }
              ideal: { type: [number, 'null'] }
              scope: { type: [number, 'null'] }
              scope_added: { type: [number, 'null'] }
              completed: { type: [number, 'null'] }
              live: { type: boolean }
        summary:
          type: object
          properties:
            start_scope: { type: [number, 'null'] }
            scope: { type: [number, 'null'] }
            scope_added: { type: [number, 'null'] }
            completed: { type: [number, 'null'] }
            remaining: { type: [number, 'null'] }
        calendar: { $ref: '#/components/schemas/ReportCalendar' }
    AverageAgeReport:
      type: object
      required: [report, scope, empty, generated_at, group_by, palette, unresolved_only, groups, overall, truncated]
      properties:
        report: { type: string, enum: [average-age] }
        scope: { $ref: '#/components/schemas/ReportScope' }
        empty: { $ref: '#/components/schemas/ReportEmpty' }
        generated_at: { type: string, format: date-time }
        group_by: { type: [string, 'null'] }
        palette: { $ref: '#/components/schemas/ReportPalette' }
        unresolved_only: { type: boolean }
        groups:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ReportGroup'
              - properties:
                  average_days: { type: number }
                  oldest_days: { type: number }
                  oldest: { type: [string, 'null'], example: ACME-12 }
        overall:
          type: object
          properties:
            count: { type: integer }
            average_days: { type: number }
            oldest_days: { type: number }
            oldest: { type: [string, 'null'] }
        truncated: { type: boolean }
    TimeReport:
      type: object
      required: [report, scope, empty, generated_at, group_by, rows, other, totals, estimate_sources, calendar, truncated]
      properties:
        report: { type: string, enum: [time] }
        scope: { $ref: '#/components/schemas/ReportScope' }
        empty: { $ref: '#/components/schemas/ReportEmpty' }
        generated_at: { type: string, format: date-time }
        group_by: { type: string }
        rows:
          type: array
          description: Largest first; at most 500.
          items:
            type: object
            required: [value, label, series, spent_minutes, estimate_minutes, difference_minutes, share, query]
            properties:
              value: { type: [string, 'null'] }
              label: { type: string }
              series: { type: [integer, 'null'] }
              spent_minutes: { type: integer }
              estimate_minutes: { type: [integer, 'null'], description: By issue or project only. }
              difference_minutes: { type: [integer, 'null'], description: 'estimate − spent; negative is over.' }
              share: { type: number }
              query: { type: [string, 'null'] }
        other: { type: [object, 'null'], properties: { spent_minutes: { type: integer }, groups: { type: integer } } }
        totals:
          type: object
          properties:
            spent_minutes: { type: integer }
            estimate_minutes: { type: [integer, 'null'] }
            difference_minutes: { type: [integer, 'null'] }
        estimate_sources:
          type: array
          items:
            type: object
            properties:
              project: { type: object, properties: { key: { type: string }, name: { type: string } } }
              field: { type: [string, 'null'], description: 'The duration field chosen as Estimation; null is the built-in.' }
        calendar: { $ref: '#/components/schemas/ReportCalendar' }
        truncated: { type: boolean }
    GanttBar:
      type: object
      required: [key, title, status, assignees, start_date, due_date, resolved, depends_on, group]
      properties:
        key: { type: string }
        title: { type: string }
        status:
          type: object
          properties:
            name: { type: string }
            category: { type: string }
            color: { $ref: '#/components/schemas/LabelColor' }
        assignees: { type: array, items: { $ref: '#/components/schemas/MemberRef' } }
        start_date: { type: [string, 'null'], format: date }
        due_date: { type: [string, 'null'], format: date }
        resolved: { type: boolean }
        depends_on: { type: array, items: { type: string } }
        group: { type: [string, 'null'], description: Set on the missing-dates list only. }
    GanttReport:
      type: object
      required: [report, scope, empty, generated_at, project, group_by, range, groups, dependencies, bar_count, missing, truncated]
      properties:
        report: { type: string, enum: [gantt] }
        scope: { $ref: '#/components/schemas/ReportScope' }
        empty: { $ref: '#/components/schemas/ReportEmpty' }
        generated_at: { type: string, format: date-time }
        project: { type: object, properties: { key: { type: string }, name: { type: string } } }
        group_by: { type: string, enum: [epic, assignee, none] }
        range: { type: [object, 'null'], properties: { start: { type: string, format: date }, end: { type: string, format: date } } }
        groups:
          type: array
          items:
            type: object
            properties:
              value: { type: [string, 'null'] }
              label: { type: string }
              query: { type: [string, 'null'] }
              start_date: { type: [string, 'null'], format: date }
              due_date: { type: [string, 'null'], format: date }
              bars: { type: array, items: { $ref: '#/components/schemas/GanttBar' } }
        dependencies:
          type: array
          items: { type: object, properties: { from: { type: string }, to: { type: string } } }
        bar_count: { type: integer }
        missing:
          type: object
          properties:
            count: { type: integer }
            issues: { type: array, items: { $ref: '#/components/schemas/GanttBar' } }
            truncated: { type: boolean }
        truncated: { type: boolean }
    TimesheetReport:
      type: object
      required: [report, scope, empty, generated_at, days, rows, day_totals, total, calendar]
      properties:
        report: { type: string, enum: [timesheet] }
        scope: { $ref: '#/components/schemas/ReportScope' }
        empty: { $ref: '#/components/schemas/ReportEmpty' }
        generated_at: { type: string, format: date-time }
        days:
          type: array
          items: { type: object, properties: { date: { type: string, format: date }, working_day: { type: boolean } } }
        rows:
          type: array
          items:
            type: object
            properties:
              member: { $ref: '#/components/schemas/MemberRef' }
              minutes: { type: array, items: { type: integer }, description: Lines up with `days`. }
              total: { type: integer }
        day_totals: { type: array, items: { type: integer } }
        total: { type: integer }
        calendar: { $ref: '#/components/schemas/ReportCalendar' }
    TimesheetWorkItem:
      type: object
      required: [id, issue, issue_title, project, author, work_date, duration_minutes, work_type, attributes, description_md]
      properties:
        id: { type: integer }
        issue: { type: string, example: ACME-12 }
        issue_title: { type: string }
        project: { type: string }
        author: { $ref: '#/components/schemas/MemberRef' }
        work_date: { type: string, format: date }
        duration_minutes: { type: integer }
        work_type: { type: [object, 'null'], properties: { name: { type: string }, short_label: { type: string } } }
        attributes:
          type: array
          items:
            type: object
            properties:
              attribute: { type: string }
              value: { type: object, properties: { name: { type: string }, short_label: { type: string } } }
        description_md: { type: string }

  headers:
    X-RateLimit-Limit: { schema: { type: integer } }
    X-RateLimit-Remaining: { schema: { type: integer } }
    X-RateLimit-Reset: { schema: { type: integer }, description: Seconds until the window resets. }

    NotificationKind:
      type: string
      enum: [assigned, unassigned, mentioned, commented, status_changed, resolved, linked, due_soon, overdue, time_logged, sprint_started, sprint_finished, article_published, article_updated, reaction]
    NotificationEmail:
      type: string
      enum: ['off', instant, daily_digest, weekly_digest]
    NotificationSubject:
      type: object
      required: [type, project, organization]
      description: 'What the entry is about. `issue` has `key` and `title`; `article` `slug` and `title`; `sprint` `slug` and `name`.'
      properties:
        type: { type: string, enum: [issue, article, sprint] }
        key: { type: string, example: PP-12 }
        slug: { type: string }
        title: { type: string }
        name: { type: string }
        project:
          type: object
          required: [key, name]
          properties: { key: { type: string }, name: { type: string } }
        organization:
          type: object
          required: [slug, name]
          properties: { slug: { type: string }, name: { type: string } }
    Notification:
      type: object
      required: [id, kind, actor, summary, detail, read_at, created_at, path]
      properties:
        id: { type: integer }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        actor:
          description: 'Null for `due_soon` and `overdue`, which nobody''s action produced.'
          oneOf: [{ $ref: '#/components/schemas/MemberRef' }, { type: 'null' }]
        summary: { type: string, example: 'Casey Kim assigned PP-12 to you' }
        detail:
          type: object
          description: 'The facts behind the summary as they settled, by name: `field`, `from`, `to`, `comment`, `work_item`, `link`, `other_issue`, `minutes`, `due_date`, `source`. On `linked`, `other_issue` is `null` when the recipient could not open the other issue''s project when the notification was written; the summary then reads "an issue in another project".'
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        path: { type: string, example: '/issue/PP-12#comment-42' }
    NotificationGroup:
      type: object
      required: [subject, latest_at, count, unread_count, kinds, notifications, path]
      properties:
        subject: { $ref: '#/components/schemas/NotificationSubject' }
        latest_at: { type: string, format: date-time }
        count: { type: integer }
        unread_count: { type: integer }
        kinds: { type: array, items: { $ref: '#/components/schemas/NotificationKind' } }
        notifications: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Notification' } }
        path: { type: string, example: /issue/PP-12 }
    UnreadCount:
      type: object
      required: [count, organizations]
      properties:
        count: { type: integer, description: Entries with anything unread. }
        organizations:
          type: array
          items:
            type: object
            required: [slug, count]
            properties: { slug: { type: string }, count: { type: integer } }
    NotificationPreferencesEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: array
                  items:
                    type: object
                    required: [kind, area, email, options, most_commonly_enabled]
                    properties:
                      kind: { $ref: '#/components/schemas/NotificationKind' }
                      area: { type: string, enum: [issues, comments, agile, knowledge_base] }
                      email: { $ref: '#/components/schemas/NotificationEmail' }
                      options: { type: array, items: { $ref: '#/components/schemas/NotificationEmail' } }
                      most_commonly_enabled: { type: boolean }
    UnsubscribeEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - properties:
            data:
              type: object
              required: [kinds, cadence, applied]
              properties:
                kinds: { type: array, items: { $ref: '#/components/schemas/NotificationKind' } }
                cadence: { type: [string, 'null'], enum: [daily, weekly, null] }
                applied: { type: boolean }
  parameters:
    ReportQuery:
      name: q
      in: query
      description: The search query language, `#{views}` included; scoped to the caller's readable projects.
      schema: { type: string, maxLength: 2000, example: 'type: Bug #Unresolved' }
    ReportView:
      name: view
      in: query
      description: A saved view the caller can see, by name, ANDed with `q`. Unknown is `400 report.unknown_view` with the visible views.
      schema: { type: string, example: My open bugs }
    ReportProjects:
      name: projects
      in: query
      description: Comma-separated project keys narrowing the scope; one the caller cannot read is `404`.
      schema: { type: string, example: 'ACME,PP' }
    ReportFrom:
      name: from
      in: query
      description: First work date, with `to`.
      schema: { type: string, format: date }
    ReportTo:
      name: to
      in: query
      schema: { type: string, format: date }
    ReportPeriod:
      name: period
      in: query
      description: 'Instead of `from`/`to`: a date word (`Last week`, `This month`), a month (`2026-09`) or a range (`2026-09-01 .. 2026-09-14`), in the caller''s timezone and the organisation''s week. Neither is This week.'
      schema: { type: string }
    IssueKey:
      name: key
      in: path
      required: true
      description: One path segment, case-insensitive.
      schema: { type: string, example: PMS-118 }
    ArticleSlug:
      name: slug
      in: path
      required: true
      description: 'The article''s slug, case-insensitive.'
      schema: { type: string, maxLength: 200, example: restoring-a-failed-sync }
    CommentId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    WorkItemId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    AttachmentId:
      name: id
      in: path
      required: true
      description: The attachment's `id` — a random uuid, its only public identifier.
      schema: { type: string, format: uuid }
    CustomFieldSlug:
      name: slug
      in: path
      required: true
      description: The field's slug, or its name URL-encoded.
      schema: { type: string, maxLength: 100 }
    ConfigValueName:
      name: name
      in: path
      required: true
      description: The value's name, case-insensitive and URL-encoded (`In%20Progress`).
      schema: { type: string, maxLength: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Any mutating request. The first response is stored for 24 hours per credential and
        replayed, with `Idempotent-Replayed: true`, for the same key and body. The same key with
        a different body answers `422`; while the first is still running, `409`. 5xx and 429
        responses are not stored, so a retry runs again.
      schema: { type: string, minLength: 1, maxLength: 255 }
    OrganizationSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    SprintName:
      name: sprint
      in: path
      required: true
      schema: { type: string, maxLength: 100 }
      description: "A sprint's name or slug, e.g. `september-2026`."
    BoardName:
      name: board
      in: path
      required: true
      schema: { type: string, maxLength: 100 }
      description: "A board's name or slug."
    SprintStates:
      name: state
      in: query
      schema: { type: string, example: 'planned,active' }
      description: 'Comma-separated: `planned`, `active`, `completed`.'
    ProjectKey:
      name: key
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 20, example: PP }
    Username:
      name: username
      in: path
      required: true
      description: Case-insensitive; a leading `@` is accepted.
      schema: { type: string, minLength: 1, maxLength: 40 }
    InvitationId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    XOrganization:
      name: X-Organization
      in: header
      description: PAT callers name the organisation by slug. Sessions use their current organisation and ignore it.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    SearchQuery:
      name: q
      in: query
      description: 'A query in the search language, e.g. `#Unresolved assignee: me sort by: updated desc`. Empty matches everything in scope.'
      schema: { type: string, maxLength: 2000 }
    SearchSort:
      name: sort
      in: query
      description: 'A `sort by:` value list, e.g. `priority, updated desc`; overrides any `sort by:` inside `q`. Errors name `sort`.'
      schema: { type: string, maxLength: 200 }
    ActivityActor:
      name: actor
      in: query
      description: '`@username`, former members included.'
      schema: { type: string, maxLength: 40 }
    ActivityKind:
      name: kind
      in: query
      description: Repeat for several kinds.
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: '#/components/schemas/OrgActivity/properties/kind' }
    ActivityFrom:
      name: from
      in: query
      description: UTC calendar date, inclusive.
      schema: { type: string, format: date }
    ActivityTo:
      name: to
      in: query
      description: UTC calendar date, inclusive.
      schema: { type: string, format: date }
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, github] }

  requestBodies:
    InvitationToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string, minLength: 1, maxLength: 200, description: 'The last segment of `/invite/<token>`.' }
    EmailInvitations:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [emails]
            properties:
              emails: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: email } }
              org_role: { $ref: '#/components/schemas/OrgRole' }
              project_role: { $ref: '#/components/schemas/ProjectRole' }
    InvitationLink:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              org_role: { $ref: '#/components/schemas/OrgRole' }
              project_role: { $ref: '#/components/schemas/ProjectRole' }
              max_uses: { type: [integer, 'null'], minimum: 1 }
              expires_at: { type: [string, 'null'], format: date-time }
              allowed_email_domain: { type: [string, 'null'], example: nothingleft.dev }
    OneTimeToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string, minLength: 1, maxLength: 200 }

  responses:
    ReportInvalid:
      description: |
        A parameter could not be used: a query error (see QueryInvalid), `search.not_groupable`,
        `report.unknown_view`, `report.unknown_user`, `report.unknown_sprint`,
        `report.no_active_sprint` and `report.unknown_attribute` with `valid_values`, or
        `report.by_category_status_only`, `report.invalid_period`, `report.period_incomplete`,
        `report.period_out_of_order`, `report.period_too_long`. `field` names the parameter.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    EmailSendFailed:
      description: |
        `email.send_failed` — the mail provider rejected or timed out on the one email this
        request exists to send. Nothing else changed; retry later. Mail that follows a change
        already saved (sign-up verification, password changed, invitations, role notices) never
        fails its request: a failed send there is reported to error tracking instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IssueNotFound:
      description: '`issue.not_found` — unknown, soft-deleted, or in a project the caller cannot read.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ArticleNotFound:
      description: '`article.not_found` — no such article, or a draft the caller cannot read, or a project they cannot read.'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    CommentNotFound:
      description: '`comment.not_found` — unknown, deleted, or on another issue; or `issue.not_found`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    WorkItemNotFound:
      description: '`work_item.not_found` — unknown, or on another issue; or `issue.not_found`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AttachmentNotFound:
      description: '`attachment.not_found` — unknown, deleted, on a deleted issue or one the caller cannot read, or someone else''s draft or unfinished upload.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    StorageNotConfigured:
      description: '`storage.not_configured` — this server has no private bucket.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IdempotencyKeyReused:
      description: '`idempotency.key_reused` — the key was used for a different request.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: |
        The caller can read the resource but may not do this. `error.code` is `forbidden` when the
        role does not allow it, or `token.scope_missing` when the role would but the PAT lacks the
        scope — then `error.scope` names the scope a new token needs. A token without `issues:read`
        reading something its owner can read answers this too, not `404`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    OrganizationNotFound:
      description: '`organization.not_found` — unknown, or one the caller does not belong to. Never a 403 (permissions.md rule 4).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SprintNotFound:
      description: '`sprint.not_found` with the sprint names in `valid_values`, or `project.not_found`.'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    BoardNotFound:
      description: '`board.not_found` with the board names in `valid_values`, or `project.not_found`.'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ProjectNotFound:
      description: '`project.not_found` — unknown in the organisation, or one the caller cannot read.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SavedViewNotFound:
      description: '`saved_view.not_found` — no view by that name that the caller can see.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    QueryInvalid:
      description: |
        The query could not be used, with `field` (`q`, `sort` or `query`), `span` and, where it
        helps, `valid_values`: `query.unknown_attribute`, `query.invalid_value` (a status, user,
        tag, project… that names nothing in scope, or a `#{Name}` that is neither a visible
        saved view nor a value), `query.missing_value`, `query.invalid_range`,
        `query.not_sortable`, `query.unknown_link`, `query.expected_subquery`,
        `query.unbalanced_braces`, `query.unterminated_quote`, `query.unexpected_token`,
        `query.unexpected_end`, `query.saved_view_cycle`; or `search.project_required`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    OrganizationAmbiguous:
      description: '`organization_ambiguous` — a session with no current organisation, or a PAT in several; `valid_values` lists candidate slugs for a PAT.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvitationGone:
      description: '`invitation.revoked`, `invitation.expired` or `invitation.exhausted`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Acknowledged:
      description: 'Done. `data` is `{ "ok": true }`, so no endpoint answers with an empty body.'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data:
                    type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean, enum: [true] }
    Unauthorized:
      description: No principal resolved from the cookie or the bearer token. `error.code` is `unauthorized`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    OriginMismatch:
      description: |
        A mutating request from a cookie-authenticated caller whose `Origin` is not the app
        origin. `error.code` is `auth.origin_mismatch`. PAT callers are exempt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Per-session, per-PAT or per-IP limit exceeded. `error.code` is `rate_limited`.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: No route or resource. `error.code` is `not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: Request failed Zod validation. `error.code` is `validation_failed`; `field` names the first failing path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
