        with the query that widens it. Cached per caller for five minutes, invalidated by any
        write in the organisation.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/XOrganization'
        - { name: project, in: query, required: true, schema: { type: string, example: ACME } }
        - { name: sprint, in: query, schema: { type: string, example: September 2026 }, description: 'A name or slug; absent is the active sprint. Unknown: `400 report.unknown_sprint` with the project''s sprint names; none active: `400 report.no_active_sprint`.' }
        - { name: measure, in: query, schema: { type: string, enum: [story_points, issue_count, remaining_estimate], default: story_points } }
      responses:
        '200':
          description: The report.
          content:
